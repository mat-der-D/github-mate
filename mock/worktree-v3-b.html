<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>github-mate — worktree</title>
<style>
:root {
  color-scheme: light dark;
  --side: #f1f3f0;
  --main: #fbfcfa;
  --term: #ffffff;
  --pop: #ffffff;
  --line: #e2e5e0;
  --line-soft: #ebeee9;
  --hover: rgba(27, 36, 30, .045);
  --sel: rgba(27, 36, 30, .085);
  --t1: #1a1f1c;
  --t2: #59625d;
  --t3: #8b938e;
  --attn: #d99a00;
  --attn-text: #8a5a00;
  --ok: #1a7f37;
  --bad: #cf222e;
  --merged: #8250df;
  --add-bg: rgba(26, 127, 55, .09);
  --del-bg: rgba(207, 34, 46, .08);
  --btn: #1a1f1c;
  --btn-text: #ffffff;
  --shadow: 0 8px 28px rgba(20, 28, 23, .14), 0 0 0 1px rgba(20, 28, 23, .08);
  --ui: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Noto Sans Mono CJK JP", "Noto Sans CJK JP", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --side: #141716;
    --main: #191c1b;
    --term: #161918;
    --pop: #202423;
    --line: #272c2a;
    --line-soft: #212524;
    --hover: rgba(225, 235, 229, .05);
    --sel: rgba(225, 235, 229, .095);
    --t1: #e4e8e5;
    --t2: #9ca5a0;
    --t3: #69726d;
    --attn: #e3b341;
    --attn-text: #e3b341;
    --ok: #3fb950;
    --bad: #f85149;
    --merged: #a371f7;
    --add-bg: rgba(63, 185, 80, .12);
    --del-bg: rgba(248, 81, 73, .12);
    --btn: #e4e8e5;
    --btn-text: #141716;
    --shadow: 0 10px 32px rgba(0, 0, 0, .5), 0 0 0 1px rgba(225, 235, 229, .09);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.5 var(--ui);
  color: var(--t1);
  background: var(--main);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--t2); outline-offset: 1px; }
button:disabled { cursor: default; }
svg { display: block; flex: none; }
code { font-family: var(--mono); font-size: .92em; }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr) auto; height: 100vh; }

/* ---------- sidebar ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
.repo { display: flex; align-items: center; gap: 6px; margin: 10px 8px 2px; padding: 6px 8px; border-radius: 6px; font-weight: 600; font-size: 13.5px; }
.repo:hover, .repo[aria-expanded="true"] { background: var(--hover); }
.repo .owner { color: var(--t3); font-weight: 400; }
.repo .chev { color: var(--t3); margin-left: 1px; }
.repo .other { margin-left: auto; display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12px; color: var(--t3); }
.nav { display: flex; align-items: center; gap: 2px; padding: 4px 8px 8px; border-bottom: 1px solid var(--line); }
.nav button { padding: 3px 8px; border-radius: 5px; color: var(--t3); }
.nav button:hover { color: var(--t1); background: var(--hover); }
.nav button[aria-current="page"] { color: var(--t1); font-weight: 600; }
.nav .new { margin-left: auto; padding: 5px; color: var(--t2); }

.list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 12px; }
.gap { height: 14px; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 4px; width: 100%; padding: 6px 8px 7px; border-radius: 6px; color: var(--t2); }
.row:hover { background: var(--hover); }
.row[aria-selected="true"] { background: var(--sel); }
.row .mk { margin-top: 6px; justify-self: center; }
.row .br { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .br i { font-style: normal; color: var(--t3); }
.row .st { grid-column: 2; display: flex; gap: 8px; font-size: 12px; color: var(--t3); white-space: nowrap; overflow: hidden; }
.row .st span:last-child { overflow: hidden; text-overflow: ellipsis; }
.row.attn { color: var(--t1); }
.row.attn .br { font-weight: 550; }
.row.attn .st b { font-weight: 500; color: var(--attn-text); }
.row .st b { font-weight: 400; color: var(--t2); }
.row.done, .row.done .st b { color: var(--t3); }
.row[aria-selected="true"] { color: var(--t1); }

.mk { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.mk.attn { background: var(--attn); }
.mk.run { width: 9px; height: 9px; border: 1.5px solid color-mix(in srgb, var(--t3) 40%, transparent); border-top-color: var(--t2); animation: spin 1.4s linear infinite; }
.mk.hold { width: 4px; height: 4px; margin: 2px; background: var(--t3); opacity: .7; }
.row .mk.hold { margin-top: 8px; }
.mk.done { background: none; color: var(--t3); width: 10px; height: 10px; border-radius: 0; }
.row .mk.done { margin-top: 5px; }
.mk.none { visibility: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .mk.run, .caret { animation: none !important; } }

.side-foot { border-top: 1px solid var(--line); padding: 6px 8px; }
.side-foot button { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--t2); width: 100%; }
.side-foot button:hover { background: var(--hover); color: var(--t1); }

/* ---------- popovers ---------- */
.pop { position: absolute; z-index: 20; background: var(--pop); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 220px; }
.pop[hidden] { display: none; }
.pop button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 5px; }
.pop button:hover:not(:disabled) { background: var(--hover); }
.pop button:disabled { color: var(--t3); }
.pop .sub { margin-left: auto; color: var(--t3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.pop .path { padding: 6px 10px 7px; color: var(--t3); font: 11.5px var(--mono); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.pop .danger:not(:disabled) { color: var(--bad); }
#repoPop { left: 8px; top: 44px; width: 252px; }
#morePop { right: 12px; top: 46px; }

/* ---------- main ---------- */
.mainc { display: flex; flex-direction: column; min-width: 0; min-height: 0; container: mainc / inline-size; position: relative; }
.head { display: flex; align-items: center; gap: 16px; padding: 12px 12px 11px 20px; }
.head .id { min-width: 0; flex: 1; }
.head h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head h1 i { font-style: normal; color: var(--t3); font-weight: 500; }
.head .about { color: var(--t2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.refs { display: flex; align-items: center; gap: 2px; flex: none; }
.ref { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; color: var(--t2); white-space: nowrap; }
.ref:hover { background: var(--hover); color: var(--t1); }
.ref[aria-pressed="true"] { background: var(--sel); color: var(--t1); }
.ref .n { color: var(--t1); font-variant-numeric: tabular-nums; }
.ref.none { color: var(--t3); }
.ref .note { color: var(--t3); }
.ref .note.attn { color: var(--attn-text); font-weight: 500; }
.ref.del { border: 1px solid var(--line); color: var(--t1); margin-left: 6px; }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--t2); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--hover); color: var(--t1); }

.tabs { display: flex; align-items: stretch; gap: 2px; height: 34px; padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; overflow: hidden; }
.tab { display: flex; align-items: center; gap: 7px; padding: 0 10px; color: var(--t2); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--t1); }
.tab[aria-selected="true"] { color: var(--t1); border-bottom-color: var(--t1); font-weight: 550; }
.tab .role { color: var(--t3); font-weight: 400; }
.tab .wait { color: var(--attn-text); font-weight: 500; font-size: 12px; }
.tab.ended, .tab.ended[aria-selected="true"] { color: var(--t3); }
.tab.cmd { font: 12px var(--mono); }
.tabs .icon-btn { align-self: center; margin-left: 2px; }

.term { flex: 1; min-height: 0; overflow: auto; background: var(--term); padding: 16px 20px 24px; font: 12.5px/1.65 var(--mono); color: var(--t2); }
.term div { white-space: pre-wrap; word-break: break-word; min-height: 1.65em; }
.term .u { color: var(--t1); background: var(--hover); margin: 8px -8px; padding: 3px 8px; border-radius: 4px; }
.term .a { color: var(--t1); padding-left: 2ch; text-indent: -2ch; }
.term .t { color: var(--t1); font-weight: 600; padding-left: 2ch; text-indent: -2ch; }
.term .a .b, .term .t .b { color: var(--t3); font-weight: 400; }
.term .t .b { color: var(--ok); }
.term .o { color: var(--t3); padding-left: 5ch; text-indent: -3ch; }
.term .c { color: var(--t1); }
.term .c .ps { color: var(--t3); }
.term .p { color: var(--ok); background: var(--add-bg); padding-left: 5ch; }
.term .m { color: var(--bad); background: var(--del-bg); padding-left: 5ch; }
.term .s { color: var(--t2); margin-top: 8px; }
.term .d { color: var(--t3); }
.term .in { color: var(--t1); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin: 12px -8px 0; }
.caret { display: inline-block; width: .6em; height: 1.15em; vertical-align: -.2em; background: var(--t1); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.launch { display: flex; align-items: center; gap: 1px; height: 38px; padding: 0 12px; border-top: 1px solid var(--line); flex: none; overflow: hidden; }
.launch button { display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 6px; border-radius: 5px; color: var(--t2); font-size: 12px; white-space: nowrap; position: relative; }
.launch button:hover { background: var(--hover); color: var(--t1); }
.launch .sep { width: 1px; height: 14px; background: var(--line); margin: 0 5px; }
@container mainc (max-width: 840px) {
  .launch { overflow: visible; }
  .launch .nm { display: none; }
  .launch button { padding: 0 9px; }
  .launch button:hover::after { content: attr(data-nm); position: absolute; bottom: 30px; left: 0; background: var(--btn); color: var(--btn-text); padding: 2px 8px; border-radius: 4px; font-size: 11.5px; z-index: 5; }
}
@container mainc (max-width: 620px) {
  .head { flex-wrap: wrap; row-gap: 6px; padding-bottom: 6px; }
  .head .id { flex-basis: 100%; }
  .refs { margin-left: -10px; }
  #morePop { top: 84px; }
}

/* ---------- panel ---------- */
.panel { width: clamp(340px, 31vw, 440px); border-left: 1px solid var(--line); background: var(--main); display: flex; flex-direction: column; min-height: 0; }
.panel[hidden] { display: none; }
.p-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 0 20px; color: var(--t2); font-size: 12.5px; }
.p-head .state { display: flex; align-items: center; gap: 5px; }
.p-head .icon-btn { margin-left: auto; }
.p-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 28px; }
.p-body h2 { margin: 0 0 4px; font-size: 15px; font-weight: 650; line-height: 1.45; }
.p-body .meta { color: var(--t3); font-size: 12px; }
.p-body h3 { margin: 22px 0 6px; font-size: 12px; font-weight: 500; color: var(--t3); }
.p-body p, .p-body ul { margin: 8px 0; }
.p-body ul { padding-left: 18px; }
.labels { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; color: var(--t2); font-size: 12px; }
.labels span { display: flex; align-items: center; gap: 5px; }
.labels span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) 55% 52%); }
.prose { margin-top: 14px; padding-top: 6px; border-top: 1px solid var(--line); }
.cm { margin-top: 12px; }
.cm .who { font-size: 12px; color: var(--t3); }
.cm .who b { color: var(--t1); font-weight: 550; }
.cm .loc { font: 11.5px var(--mono); color: var(--t3); }
.cm p { margin: 2px 0 0; }
.kv { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.kv .r { margin-left: auto; color: var(--t3); font-size: 12px; white-space: nowrap; }
.kv .ok { color: var(--ok); } .kv .bad { color: var(--bad); } .kv .wait { color: var(--t3); }
.kv .failtext { color: var(--bad); }
.merge { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; color: var(--t2); font-size: 12.5px; }
.btn { height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); font-weight: 550; white-space: nowrap; flex: none; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--btn); color: var(--btn-text); border-color: transparent; }
.btn.primary:hover { background: var(--btn); opacity: .88; }
.btn:disabled { color: var(--t3); }
.empty { padding-top: 28px; color: var(--t2); }
.empty .btn { margin-top: 12px; display: block; }
.file { margin-top: 16px; }
.file .fn { display: flex; gap: 10px; font: 12px var(--mono); color: var(--t1); padding-bottom: 5px; overflow-wrap: anywhere; }
.file .fn .cnt { white-space: nowrap; }
.file .fn .cnt { margin-left: auto; color: var(--t3); }
.file .fn .cnt .pl { color: var(--ok); } .file .fn .cnt .mi { color: var(--bad); }
.hunk { font: 11.5px/1.6 var(--mono); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; background: var(--term); padding: 4px 0; }
.hunk div { white-space: pre; padding: 0 10px; min-width: max-content; color: var(--t2); }
.hunk .hh { color: var(--t3); }
.hunk .pl { background: var(--add-bg); color: var(--t1); }
.hunk .mi { background: var(--del-bg); color: var(--t1); }
.state .open { color: var(--ok); } .state .merged { color: var(--merged); } .state .draft { color: var(--t3); }

@media (max-width: 1200px) {
  .app { grid-template-columns: 244px minmax(0, 1fr) auto; }
  #repoPop { width: 228px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <button class="repo" id="repoBtn" aria-haspopup="true" aria-expanded="false">
      <span><span class="owner">acme/</span>webapp</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      <span class="other" title="ほかのリポジトリで対応が必要な worktree"><span class="mk attn"></span>ほか 2</span>
    </button>
    <div class="pop" id="repoPop" hidden></div>
    <nav class="nav" aria-label="画面">
      <button aria-current="page">worktree</button>
      <button>Issue</button>
      <button>PR</button>
      <button class="new icon-btn" title="新しい worktree" aria-label="新しい worktree"></button>
    </nav>
    <div class="list" id="list" role="listbox" aria-label="worktree"></div>
    <div class="side-foot"><button id="settings"></button></div>
  </aside>

  <main class="mainc">
    <header class="head">
      <div class="id"><h1 id="title"></h1><div class="about" id="about"></div></div>
      <div class="refs" id="refs"></div>
    </header>
    <div class="pop" id="morePop" hidden></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="セッション"></div>
    <div class="term" id="term" role="tabpanel"></div>
    <div class="launch" id="launch" aria-label="この worktree で実行"></div>
  </main>

  <aside class="panel" id="panel" hidden>
    <div class="p-head" id="phead"></div>
    <div class="p-body" id="pbody"></div>
  </aside>
</div>

<script>
/* ---------- icons ---------- */
const svg = (d, s) => '<svg width="' + (s || 14) + '" height="' + (s || 14) + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const I = {
  folder: '<path d="M1.8 4.2c0-.6.4-1 1-1h3l1.4 1.6h6c.6 0 1 .4 1 1v6.4c0 .6-.4 1-1 1H2.8c-.6 0-1-.4-1-1z"/>',
  code: '<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/>',
  claude: '<path d="M8 1.8v12.4M2.6 4.9l10.8 6.2M13.4 4.9L2.6 11.1"/>',
  codex: '<path d="M8 1.8l5.4 3.1v6.2L8 14.2l-5.4-3.1V4.9z"/><circle cx="8" cy="8" r="1.7"/>',
  agy: '<path d="M2.2 13L8 2.6 13.8 13M5.4 9.6h5.2"/>',
  issue: '<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/>',
  review: '<path d="M1.5 8S4 3.6 8 3.6 14.5 8 14.5 8 12 12.4 8 12.4 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.8"/>',
  build: '<path d="M8 1.8l5.6 3.1v6.2L8 14.2l-5.6-3.1V4.9zM2.6 5L8 8l5.4-3M8 8v6"/>',
  test: '<path d="M6 1.8h4M6.6 1.8v4.4L3 12.4c-.4.8.1 1.8 1 1.8h8c.9 0 1.4-1 1-1.8L9.4 6.2V1.8M4.8 10h6.4"/>',
  plus: '<path d="M8 3.2v9.6M3.2 8h9.6"/>',
  more: '<circle cx="3.5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1" fill="currentColor" stroke="none"/>',
  gear: '<circle cx="8" cy="8" r="2.1"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/>',
  x: '<path d="M4 4l8 8M12 4l-8 8"/>',
  check: '<path d="M3 8.4l3.2 3.2L13 4.6"/>',
  dot: '<circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/>',
  pr: '<circle cx="4" cy="3.6" r="1.6"/><circle cx="4" cy="12.4" r="1.6"/><circle cx="12" cy="12.4" r="1.6"/><path d="M4 5.2v5.6M12 10.8V7c0-1.4-1-2.4-2.4-2.4H8.2M9.8 3L8.2 4.6l1.6 1.6"/>',
  merged: '<circle cx="4" cy="3.6" r="1.6"/><circle cx="4" cy="12.4" r="1.6"/><circle cx="12" cy="8.6" r="1.6"/><path d="M4 5.2v5.6M4 5.2c0 2.4 2 3.4 6.4 3.4"/>'
};
const ic = (k, s) => svg(I[k], s);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const L = s => s.replace(/^\n/, '').replace(/\n$/, '').split('\n');

/* ---------- fake data ---------- */
const ME = 'hinata';
const HUE = { bug: 0, enhancement: 190, refactor: 265, performance: 35, frontend: 215, backend: 130, security: 340 };
const REPOS = [['acme/', 'webapp', 4], ['acme/', 'api-server', 2], ['hinata/', 'dotfiles', 0]];
const ACTIONS = [
  ['claude', 'Claude Code'], ['codex', 'Codex'], ['agy', 'Antigravity'], 0,
  ['issue', 'Issue を実装'], ['review', 'PR をレビュー'], 0,
  ['build', 'ビルド'], ['test', 'テスト'], 0,
  ['folder', 'フォルダを開く'], ['code', 'VS Code']
];

const ISSUES = {
  214: { title: '検索結果のページネーションが2ページ目で重複する', labels: ['bug', 'backend'], author: 'sato-k', opened: '2日前',
    body: '<p>検索結果の2ページ目に、1ページ目の末尾にあった項目がもう一度出ることがあります。</p><p>再現手順</p><ul><li>「請求」で検索する（スコアが同じ項目が多い）</li><li>2ページ目に進む</li><li>1ページ目の 19〜20 件目と同じ項目が先頭に出る</li></ul><p>期待する動作：どの項目も1回だけ出る。</p>',

WT.forEach(w => { if (!w.path) w.path = '~/dev/webapp.worktrees/' + w.branch.replace(/\//g, '-'); });

/* ---------- state ---------- */
const S = { w: 1, s: {}, panel: null };
const $ = id => document.getElementById(id);
const cur = () => WT[S.w];
const sidx = () => (S.w in S.s ? S.s[S.w] : (cur().start || 0));
const mark = k => k === 'done' ? '<span class="mk done">' + ic('check', 10) + '</span>' : '<span class="mk ' + k + '"></span>';
const branchHtml = b => { const i = b.indexOf('/'); return i < 0 ? esc(b) : '<i>' + esc(b.slice(0, i + 1)) + '</i>' + esc(b.slice(i + 1)); };

/* ---------- sidebar ---------- */
function renderList() {
  let html = '', prev = null;
  WT.forEach((w, i) => {
    const k = w.status[0];
    const group = k === 'attn' ? 'attn' : k === 'none' ? 'none' : 'rest';
    if (prev && group !== prev) html += '<div class="gap"></div>';
    prev = group;
    const tip = w.issue ? '#' + w.issue + ' ' + ISSUES[w.issue].title : (w.about || '');
    html += '<button class="row ' + k + '" role="option" data-w="' + i + '" aria-selected="' + (i === S.w) + '" title="' + esc(tip) + '">'
      + mark(k) + '<span class="br">' + branchHtml(w.branch) + '</span>'
      + (w.status[1] ? '<span class="st"><b>' + w.status[1] + '</b><span>' + w.status[2] + '</span></span>' : '')
      + '</button>';
  });
  $('list').innerHTML = html;
}

/* ---------- header ---------- */
function renderHead() {
  const w = cur(), is = w.issue && ISSUES[w.issue], pr = w.pr && PRS[w.pr];
  $('title').innerHTML = branchHtml(w.branch);
  $('about').textContent = is ? is.title : (w.about || '');
  const on = p => ' aria-pressed="' + (S.panel === p) + '"';
  let h = '';
  if (!w.main) {
    h += is ? '<button class="ref" data-p="issue"' + on('issue') + '>Issue <span class="n">#' + w.issue + '</span></button>'
            : '<button class="ref none" data-p="issue"' + on('issue') + '>Issue なし</button>';
    h += pr ? '<button class="ref" data-p="pr"' + on('pr') + '>PR <span class="n">#' + w.pr + '</span>'
              + (pr.attn ? '<span class="mk attn"></span><span class="note attn">' + pr.note + '</span>' : '<span class="note">' + (w.theirs ? w.theirs : pr.note) + '</span>') + '</button>'
            : '<button class="ref none" data-p="pr"' + on('pr') + '>PR なし</button>';
  }
  h += '<button class="ref" data-p="diff"' + on('diff') + '>差分' + (w.dirty ? ' <span class="note">未コミット ' + w.dirty + '</span>' : '') + '</button>';
  if (pr && pr.state === 'Merged') h += '<button class="ref del">worktree を削除</button>';
  h += '<button class="icon-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="その他" title="その他">' + ic('more', 16) + '</button>';
  $('refs').innerHTML = h;
  $('morePop').hidden = true;
  $('morePop').innerHTML = '<div class="path">' + esc(w.path) + '</div>'
    + '<button>パスをコピー</button>'
    + '<button>GitHub でブランチを開く</button>'
    + (w.main ? '<button disabled>worktree を削除<span class="sub">main は削除できません</span></button>' : '<button class="danger">worktree を削除</button>');
}

/* ---------- sessions + terminal ---------- */
function renderTabs() {
  const w = cur(), si = sidx();
  $('tabs').innerHTML = w.sessions.map((s, i) => {
    const sel = ' role="tab" data-s="' + i + '" aria-selected="' + (i === si) + '"';
    if (!s.cli) return '<button class="tab cmd"' + sel + '>' + esc(s.name) + '</button>';
    const st = s.st === 'wait' ? ['attn', '指示待ち'] : s.st === 'run' ? ['run', '実行中'] : [null, '終了'];
    return '<button class="tab' + (s.st === 'done' ? ' ended' : '') + '"' + sel + ' title="' + s.cli + '（' + s.role + '）— ' + st[1] + '">'
      + (st[0] ? mark(st[0]) : '') + s.cli + ' <span class="role">' + s.role + '</span>'
      + (s.st === 'wait' ? '<span class="wait">指示待ち</span>' : s.st === 'done' ? '<span class="role">終了</span>' : '') + '</button>';
  }).join('') + '<button class="icon-btn" title="新しいターミナル" aria-label="新しいターミナル">' + ic('plus') + '</button>';
}
function renderTerm() {
  const w = cur(), s = w.sessions[sidx()];
  const ps = '<span class="ps">' + esc(w.path) + ' $</span> ';
  const caret = '<span class="caret"></span>';
  let h = s.term.map((ln, i) => {
    const k = ln.indexOf('|'), t = ln.slice(0, k), x = esc(ln.slice(k + 1));
    const last = i === s.term.length - 1;
    switch (t) {
      case 'u': return '<div class="u">' + x + '</div>';
      case 'a': return '<div class="a">' + (/^(•|\s)/.test(x) ? x : '<span class="b">●</span> ' + x) + '</div>';
      case 't': return '<div class="t"><span class="b">●</span> ' + x + '</div>';
      case 'o': return '<div class="o">⎿  ' + x + '</div>';
      case '$': return '<div class="c">' + ps + x + (last ? caret : '') + '</div>';
      case 'm': return '<div class="m">' + x + '</div>';
      case 'p': return '<div class="p">' + x + '</div>';
      case 's': return '<div class="s">' + x + '</div>';
      default: return '<div class="d">' + x + '</div>';
    }
  }).join('');
  if (s.st === 'wait') h += '<div class="in">&gt; ' + caret + '</div>';
  if (s.st === 'done') h += '<div class="d"></div><div class="d">セッションを終了しました（' + s.end + '）</div>';
  $('term').innerHTML = h;
  $('term').scrollTop = 0;
}
function renderLaunch() {
  $('launch').innerHTML = ACTIONS.map(a => a
    ? '<button data-nm="' + a[1] + '" aria-label="' + a[1] + '">' + ic(a[0]) + '<span class="nm">' + a[1] + '</span></button>'
    : '<span class="sep"></span>').join('');
}

/* ---------- panel ---------- */
const comment = (who, when, body, loc) => '<div class="cm"><div class="who"><b>' + esc(who) + '</b>　' + when + '</div>' + (loc ? '<div class="loc">' + esc(loc) + '</div>' : '') + '<p>' + body + '</p></div>';
function renderPanel() {
  const p = S.panel, w = cur();
  $('panel').hidden = !p;
  if (!p) return;
  const close = '<button class="icon-btn" id="closeP" title="閉じる" aria-label="閉じる">' + ic('x') + '</button>';
  let head = '', body = '';
  if (p === 'issue') {
    const is = w.issue && ISSUES[w.issue];
    if (!is) { head = 'Issue'; body = '<div class="empty">この worktree に Issue は関連付けられていません。<button class="btn">Issue を関連付ける</button></div>'; }
    else {
      head = 'Issue #' + w.issue + '<span class="state"><span class="' + (is.closed ? 'merged' : 'open') + '">' + ic(is.closed ? 'check' : 'issue', 13) + '</span>' + (is.closed ? 'Closed' : 'Open') + '</span>';
      body = '<h2>' + esc(is.title) + '</h2><div class="meta">' + is.author + ' が ' + is.opened + 'に作成</div>'
        + '<div class="labels">' + is.labels.map(l => '<span style="--h:' + HUE[l] + '">' + l + '</span>').join('') + '</div>'
        + '<div class="prose">' + is.body + '</div>'
        + (is.comments.length ? '<h3>コメント ' + is.comments.length + '件</h3>' + is.comments.map(c => comment(c[0], c[1], c[2])).join('') : '');
    }
  } else if (p === 'pr') {
    const pr = w.pr && PRS[w.pr];
    if (!pr) { head = 'PR'; body = '<div class="empty">このブランチの PR はまだありません。' + (w.dirty ? '<br>未コミットの変更が ' + w.dirty + ' ファイルあります。' : '') + '<button class="btn">PR を作成</button></div>'; }
    else {
      const sc = pr.state.toLowerCase();
      head = 'PR #' + w.pr + '<span class="state"><span class="' + sc + '">' + ic(sc === 'merged' ? 'merged' : 'pr', 13) + '</span>' + pr.state + '</span>';
      const bad = pr.checks.filter(c => c[1] === 'bad').length, run = pr.checks.filter(c => c[1] === 'wait').length;
      body = '<h2>' + esc(pr.title) + '</h2><div class="meta">' + pr.author + '　<code>' + esc(w.branch) + '</code> → <code>main</code></div>'
        + '<h3>CI　' + (bad ? bad + ' 件失敗' : run ? '実行中' : 'すべて成功') + '</h3>'
        + pr.checks.map(c => '<div class="kv"><span class="' + c[1] + '">' + ic(c[1] === 'ok' ? 'check' : c[1] === 'bad' ? 'x' : 'dot', 13) + '</span>' + c[0] + '<span class="r' + (c[1] === 'bad' ? ' failtext' : '') + '">' + c[2] + '</span></div>').join('')
        + (pr.fail ? '<div class="hunk" style="margin-top:6px">' + pr.fail.split('\n').map(l => '<div>' + esc(l) + '</div>').join('') + '</div>' : '')
        + '<h3>レビュー</h3>'
        + (pr.reviews.length ? pr.reviews.map(r => '<div class="kv">' + r[0] + '<span class="r">' + r[1] + '</span></div>').join('') : '<div class="meta">レビューは依頼していません</div>')
        + (pr.threads.length ? '<h3>レビューコメント ' + pr.threads.length + '件</h3>' + pr.threads.map(t => comment(t[0], '', t[2], t[1])).join('') : '')
        + (pr.state === 'Merged' ? '<div class="merge">' + pr.merge[1] + '</div>'
          : '<div class="merge"><button class="btn' + (pr.merge[0] ? ' primary' : '') + '"' + (pr.merge[0] ? '' : ' disabled') + '>マージ</button>' + pr.merge[1] + '</div>');
    }
  } else {
    head = '差分';
    if (!w.files.length) body = '<div class="empty">変更はありません。</div>';
    else {
      const a = w.files.reduce((n, f) => n + f.add, 0), d = w.files.reduce((n, f) => n + f.del, 0);
      head += '<span>' + (w.pr ? 'main との差分' : '未コミットの変更') + '　' + w.files.length + ' ファイル　+' + a + ' −' + d + '</span>';
      body = w.files.map(f => '<div class="file"><div class="fn">' + esc(f.path) + '<span class="cnt"><span class="pl">+' + f.add + '</span> <span class="mi">−' + f.del + '</span></span></div><div class="hunk">'
        + f.lines.map(l => '<div class="' + (l[0] === '+' ? 'pl' : l[0] === '-' ? 'mi' : l[0] === '@' ? 'hh' : '') + '">' + (esc(l) || ' ') + '</div>').join('') + '</div></div>').join('');
    }
  }
  $('phead').innerHTML = head + close;
  $('pbody').innerHTML = body;
  $('pbody').scrollTop = 0;
}

function render() { renderList(); renderHead(); renderTabs(); renderTerm(); renderPanel(); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  const inPop = e.target.closest('.pop');
  if (!t || (t.id !== 'repoBtn' && !inPop)) { $('repoPop').hidden = true; $('repoBtn').setAttribute('aria-expanded', 'false'); }
  if (!t || t.id !== 'moreBtn') { $('morePop').hidden = true; }
  if (!t) return;
  if (t.dataset.w) { S.w = +t.dataset.w; render(); }
  else if (t.dataset.s) { S.s[S.w] = +t.dataset.s; renderTabs(); renderTerm(); }
  else if (t.dataset.p) { S.panel = S.panel === t.dataset.p ? null : t.dataset.p; renderHead(); renderPanel(); }
  else if (t.id === 'closeP') { S.panel = null; renderHead(); renderPanel(); }
  else if (t.id === 'repoBtn') { const o = $('repoPop').hidden; $('repoPop').hidden = !o; t.setAttribute('aria-expanded', o); }
  else if (t.id === 'moreBtn') { const o = $('morePop').hidden; $('morePop').hidden = !o; t.setAttribute('aria-expanded', o); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('repoPop').hidden = true; $('morePop').hidden = true; if (S.panel) { S.panel = null; renderHead(); renderPanel(); } } });

/* ---------- static parts ---------- */
document.querySelector('.nav .new').innerHTML = ic('plus');
$('settings').innerHTML = ic('gear') + '設定';
$('repoPop').innerHTML = REPOS.map((r, i) => '<button><span><span style="color:var(--t3)">' + r[0] + '</span>' + r[1] + '</span>'
  + '<span class="sub">' + (r[2] ? '<span class="mk attn"></span>' + r[2] : '') + (i === 0 ? ic('check', 12) : '') + '</span></button>').join('')
  + '<button style="color:var(--t2)">' + ic('plus', 12) + 'リポジトリを追加</button>';
renderLaunch();

/* 確認用：#w=2&s=1&p=pr&pop=repo で状態を指定して開ける */
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => {
  if (k === 'w') S.w = +v; if (k === 's') S.s[S.w] = +v; if (k === 'p') S.panel = v;
  if (k === 'pop') setTimeout(() => { $(v + 'Pop').hidden = false; }, 0);
});
render();
</script>
