<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>github-mate 画面モック</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f6f7fa; --line:#d9dde6; --line2:#e8ebf1;
  --text:#1b2030; --muted:#5f6779; --faint:#8a92a3;
  --primary:#3451c6; --primary-bg:#e7ebfb; --on-primary:#ffffff;
  --wait:#f2a100; --wait-fg:#2a1c00; --wait-tint:#fff4d6; --wait-line:#c97f00;
  --run:#0b7285; --run-tint:#e0f4f7;
  --ok:#2b8a3e; --ok-tint:#e3f5e6; --fail:#c92a2a; --fail-tint:#fde8e8;
  --merged:#6741d9; --merged-tint:#ede8fc; --pend:#a8730a;
  --term-bg:#1a1e26; --term-fg:#d3d8e2; --term-dim:#8791a5; --term-line:#2c323e;
  --add-bg:#e2f6e5; --del-bg:#fde6e6; --add-num:#c9edcf; --del-num:#f9cfcf; --hunk:#eef1fb;
  --shadow:0 1px 2px rgba(20,28,50,.06),0 8px 28px rgba(20,28,50,.12);
  --ui:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171d; --surface:#1c2028; --surface2:#222730; --line:#313846; --line2:#282e3a;
    --text:#e3e7ef; --muted:#9aa3b5; --faint:#747d90;
    --primary:#8ea3ff; --primary-bg:#262e4d; --on-primary:#10142a;
    --wait:#ffb520; --wait-fg:#2a1c00; --wait-tint:#3a2e12; --wait-line:#ffb520;
    --run:#4cc9db; --run-tint:#15323a;
    --ok:#5fcf75; --ok-tint:#17321e; --fail:#ff7373; --fail-tint:#3b1c1f;
    --merged:#b49cff; --merged-tint:#2a2346; --pend:#e0b040;
    --term-bg:#0f1217; --term-fg:#d3d8e2; --term-dim:#7d879b; --term-line:#252b36;
    --add-bg:#173021; --del-bg:#3a1d21; --add-num:#1f4a2e; --del-num:#57262c; --hunk:#20263a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3,p{margin:0}
svg{flex:none}
[hidden]{display:none!important}

/* ---- frame ---- */
#app{display:grid;grid-template-rows:46px 1fr;grid-template-columns:68px minmax(0,1fr);height:100vh;min-width:1000px}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;display:flex;align-items:center;gap:7px;margin-right:4px}
.brand i{width:18px;height:18px;border-radius:5px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary)}
.repo{position:relative}
.repo-btn{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);font-family:var(--mono);font-size:12.5px;font-weight:600}
.repo-menu{position:absolute;top:36px;left:0;width:310px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:5px;z-index:30}
.repo-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:6px}
.repo-menu button:hover{background:var(--surface2)}
.repo-menu button[aria-current=true]{background:var(--primary-bg)}
.repo-menu .nm{font-family:var(--mono);font-size:12.5px;font-weight:600;flex:1}
.repo-menu .ct{color:var(--muted);font-size:12px}
.repo-menu .add{color:var(--muted);border-top:1px solid var(--line2);border-radius:0 0 6px 6px;margin-top:4px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:8px}
.seg button{display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:6px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08)}
.grow{flex:1}
.alert{display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;background:var(--wait);color:var(--wait-fg);font-weight:700;white-space:nowrap}
.alert.none{background:none;color:var(--muted);font-weight:500;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--fail);border-color:var(--fail);color:#fff}
@media (prefers-color-scheme: dark){.btn.ok,.btn.danger{color:#0f1217}}
.btn.sm{height:25px;padding:0 8px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.5;cursor:default}
.del{color:var(--fail)}

.rail{display:flex;flex-direction:column;gap:4px;padding:8px 6px;background:var(--surface);border-right:1px solid var(--line)}
.rail button{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;border-radius:8px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.rail button:hover{background:var(--surface2);color:var(--text)}
.rail button[aria-current=true]{background:var(--primary-bg);color:var(--primary)}
.rail .n{font-size:10.5px;font-weight:500;color:var(--faint)}
.rail .wd{position:absolute;top:6px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--wait);box-shadow:0 0 0 2px var(--surface)}
.rail .sp{flex:1}

/* ---- state chips ---- */
.st{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap;font-family:var(--ui)}
.st.wait{background:var(--wait);color:var(--wait-fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--wait) 28%,transparent)}
.st.run{background:var(--run-tint);color:var(--run)}
.st.done{background:none;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}
.st.wait .dot{animation:pulse 1.4s ease-in-out infinite}
.spin{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .9s linear infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.55}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.chip.none{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint);font-weight:500}
.chip.open{color:var(--ok);background:var(--ok-tint);box-shadow:none}
.chip.merged{color:var(--merged);background:var(--merged-tint);box-shadow:none}
.chip.ok{color:var(--ok);background:var(--ok-tint);box-shadow:none}
.chip.fail{color:var(--fail);background:var(--fail-tint);box-shadow:none}
.chip.pend{color:var(--pend)}
.chip.rev{color:var(--primary);background:var(--primary-bg);box-shadow:none}
.chip.who{background:none;box-shadow:none;padding:0 2px;color:var(--muted);font-weight:500}
.chip .av{width:14px;height:14px;font-size:7.5px}
button.chip:hover{box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.num{font-family:var(--mono);color:var(--muted);font-size:12px}
.branch{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:0}
.branch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-title{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;font-weight:700;min-width:0;flex:1}
.bt-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.il{display:flex;gap:6px;min-width:0;color:var(--muted)}
.il .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.il.no{color:var(--faint)}
.lab{display:inline-block;padding:0 7px;height:18px;line-height:18px;border-radius:9px;font-size:11px;font-weight:600;background:hsl(var(--h) 70% 90%);color:hsl(var(--h) 60% 26%)}
@media (prefers-color-scheme: dark){.lab{background:hsl(var(--h) 40% 22%);color:hsl(var(--h) 75% 80%)}}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:hsl(var(--h) 45% 50%);color:#fff;font-size:9.5px;font-weight:700;flex:none}
.av.lg{width:28px;height:28px;font-size:11px}

/* ---- list + detail ---- */
#main{min-height:0;min-width:0;overflow:hidden}
.ld{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.ld.wide{grid-template-columns:430px minmax(0,1fr)}
.list{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);min-height:0;min-width:0}
.list-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;font-weight:700}
.list-h small{color:var(--muted);font-weight:500;flex:1}
.rows{overflow:auto;flex:1}
.row{display:block;width:100%;padding:9px 12px 10px 13px;border-bottom:1px solid var(--line2);border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--surface2)}
.row[aria-selected=true]{background:var(--primary-bg);border-left-color:var(--primary)}
.row.wait{border-left-color:var(--wait)}
.row.wait:not([aria-selected=true]){background:var(--wait-tint)}
.row .l1{display:flex;gap:7px;align-items:center}
.row .tt{flex:1;font-weight:600;line-height:1.4}
.row .l2{margin-top:3px}
.row .l3{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.row .wl{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px;color:var(--muted);font-size:12px}
.row .wl .sp{flex:1}
.ai{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--muted)}
.ai span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ai .wait{color:var(--wait-line);font-weight:700}.ai .run{color:var(--run)}
.why{color:var(--wait-line);font-weight:700;font-size:12px;white-space:nowrap}
.list-f{padding:10px 12px;border-top:1px solid var(--line)}
.list-f .btn{width:100%;justify-content:center}

.detail{display:flex;flex-direction:column;min-width:0;min-height:0}
.dh{padding:11px 16px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.dh .top{display:flex;align-items:center;gap:10px}
.dh h1{font:700 15px/1.4 var(--mono);display:flex;gap:7px;align-items:center;flex:1;min-width:0}
.dh h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px;margin-top:6px;color:var(--muted)}
.dh .meta .il{max-width:100%}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);font-weight:600;font-size:12.5px}
button.act:not([disabled]):hover{border-color:var(--primary);color:var(--primary)}
.act[disabled],.act.off{opacity:.42;cursor:not-allowed;border-style:dashed}
.act.add{border-style:dashed;background:none;color:var(--muted);padding:0 9px}
.tabs{display:flex;gap:2px;margin-top:10px}
.tabs button{display:flex;align-items:center;gap:6px;padding:7px 13px 8px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--primary)}
.cnt{font-size:11px;background:var(--bg);border-radius:8px;padding:0 6px;color:var(--muted)}
.tabs .wd{width:8px;height:8px;border-radius:50%;background:var(--wait)}
.body{flex:1;min-height:0;overflow:auto}

/* issue / pr page */
.page{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;padding:16px 18px 28px;max-width:1080px}
.ph{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ph h2{font-size:17px;font-weight:700;flex-basis:100%}
.big{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font-weight:700;font-size:12px;color:#fff;background:var(--ok)}
.big.merged,.big.closed{background:var(--merged)}.big.draft{background:var(--faint)}
@media (prefers-color-scheme: dark){.big{color:#0f1217}}
.cm{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;margin-bottom:14px}
.cm .box{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.cm .hd{padding:6px 12px;border-bottom:1px solid var(--line2);background:var(--surface2);border-radius:8px 8px 0 0;color:var(--muted);font-size:12px}
.cm .hd b{color:var(--text)}
.cm .tx{padding:10px 12px;line-height:1.7}
.cm .tx p+p,.cm .tx ul+p,.cm .tx p+ul{margin-top:8px}
.cm .tx ul{margin:0;padding-left:20px}
.cm .tx code,.rc code{background:var(--surface2);padding:1px 4px;border-radius:4px}
.ev{display:flex;align-items:center;gap:8px;margin:0 0 12px 38px;color:var(--muted);font-size:12.5px}
.ev b{color:var(--text);font-weight:600}
.ev .sha{font-family:var(--mono);font-size:11.5px}
.ev.okc,.ev.okc b{color:var(--ok)}
.reply{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 12px;color:var(--faint);min-height:62px}
.reply-a{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.side section{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line2)}
.side h3{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.side .li{display:flex;align-items:center;gap:6px;margin-bottom:5px;min-width:0}
.side .li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box2{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:4px 0 16px 38px}
.box2 .r{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2)}
.box2 .r:last-child{border-bottom:0}
.box2 .r.h{font-weight:700;background:var(--surface2);border-radius:8px 8px 0 0}
.box2 .r .t{flex:1}.box2 .r small{color:var(--muted)}
.box2 .mg{padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ic-ok{color:var(--ok)}.ic-fail{color:var(--fail)}.ic-pend{color:var(--pend)}.ic-mg{color:var(--merged)}
.sub{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.sub button{padding:8px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.sub button[aria-selected=true]{color:var(--text);border-bottom-color:var(--primary)}
.empty{display:grid;place-items:center;align-content:center;gap:10px;height:100%;min-height:300px;color:var(--muted);text-align:center;padding:24px}
.empty b{color:var(--text);font-size:15px}
.empty .bs{display:flex;gap:8px;margin-top:4px}
.empty .form{width:min(520px,100%);text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:14px;display:grid;gap:9px;margin-top:6px}
.field{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface2);color:var(--text);min-height:32px}

/* diff */
.dwrap{padding:14px 18px 28px}
.dsum{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted)}
.dsum b{color:var(--text)}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--fail);font-weight:700}
.flist{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px}
.flist div{display:flex;gap:10px;padding:5px 12px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:12px}
.flist div:last-child{border:0}.flist .p{flex:1}
.file{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px;overflow:hidden}
.file .fh{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;font-weight:600}
.file .fh .p{flex:1}
.dl{display:grid;grid-template-columns:44px 44px minmax(0,1fr);font:12px/20px var(--mono)}
.dl .n{text-align:right;padding-right:8px;color:var(--faint);user-select:none}
.dl .c{white-space:pre;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.dl.add .c{background:var(--add-bg)}.dl.add .n{background:var(--add-num)}
.dl.del .c{background:var(--del-bg)}.dl.del .n{background:var(--del-num)}
.dl.hunk .c,.dl.hunk .n{background:var(--hunk);color:var(--muted)}
.rv .dl:not(.hunk):hover .n:first-child::before{content:"+";float:left;margin:2px 0 0 4px;width:16px;height:16px;line-height:16px;border-radius:4px;background:var(--primary);color:var(--on-primary);text-align:center;font-weight:700}
.rc{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface2);padding:10px 14px 10px 58px;font-family:var(--ui)}
.rc .one{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;margin-bottom:8px;max-width:700px}
.rc .one b{font-size:12.5px}.rc .one small{color:var(--muted);margin-left:6px}
.rc .field{max-width:700px;color:var(--faint)}

/* terminal */
.tw{display:flex;flex-direction:column;height:100%;background:var(--term-bg)}
.stabs{display:flex;align-items:center;gap:2px;padding:5px 8px 0;background:var(--surface2);border-bottom:1px solid var(--line)}
.stabs .s{display:flex;align-items:center;gap:6px;padding:5px 11px 6px;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;color:var(--muted);font-weight:600;font-size:12.5px;margin-bottom:-1px}
.stabs .s[aria-selected=true]{background:var(--term-bg);color:var(--term-fg);border-color:var(--line)}
.stabs .wait{color:var(--wait)}.stabs .run{color:var(--run)}.stabs .done{color:var(--faint)}
.stabs .sp{margin-left:auto;margin-bottom:4px}
.panes{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.panes.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane+.pane{border-left:1px solid var(--term-line)}
.pane .pt{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:11.5px;color:var(--term-dim);border-bottom:1px solid var(--term-line);font-family:var(--mono);min-height:28px}
.pane .pt .st{height:18px}
.term{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 14px 12px;font:12.5px/1.6 var(--mono);color:var(--term-fg);min-height:0}
.term div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.6em;flex:none}
.term .u{background:#ffffff12;border-radius:4px;padding:1px 8px;margin:5px -8px;color:#fff}
.term .t{font-weight:700}.term .t::before{content:"● ";color:#5fcf75}
.term .a::before{content:"● ";color:#c7cedb}
.term .o{color:var(--term-dim);padding-left:2ch}.term .o::before{content:"⎿ "}
.term .d{color:var(--term-dim)}
.term .p,.term .g{color:#7fd4a0}.term .m,.term .e{color:#ff8a8a}
.term .w{color:#ffc94d;border-left:2px solid #ffb520;padding-left:10px;margin-left:2px;background:#ffb5200f}
.term .s{color:#e8a66b}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-2px;background:var(--term-fg);animation:blink 1.1s steps(1) infinite}

/* ================= helpers ================= */
const S = { repo: 'acme/webapp', view: 'wt', layout: 'list', sel: {}, isel: {}, psel: {}, tab: 'term', prTab: 'conv', split: true, sess: 0 };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);
const repo = () => REPOS[S.repo];
const cur = () => repo().wts.find(w => w.branch === S.sel[S.repo]) || repo().wts.find(w => !w.main) || repo().wts[0];
const issueById = id => repo().issues.find(i => i.id === id) || null;
const prByNum = n => repo().prs.find(p => p.num === n) || null;
const wtByBranch = b => repo().wts.find(w => w.branch === b) || null;
const openIssues = () => repo().issues.filter(i => i.state !== 'closed');
const openPrs = () => repo().prs.filter(p => p.state !== 'merged');
const RANK = { wait: 0, run: 1, done: 2 };
const ST_LABEL = { wait: '入力待ち', run: '実行中', done: '終了' };
const aiSessions = w => w.sessions.filter(s => s.ai);
const agg = w => aiSessions(w).map(s => s.st).sort((a, b) => RANK[a] - RANK[b])[0] || 'noai';
const whyOf = w => (aiSessions(w).find(s => s.st === 'wait') || {}).why || '';
const waitCount = r => r.wts.filter(w => agg(w) === 'wait').length;
const wtPath = b => { const w = repo().wts.find(x => x.branch === b); return w && w.main ? repo().dir : repo().dir + '.worktrees/' + b.replace(/\//g, '-'); };
const asg = i => i.assignee === undefined ? ME : i.assignee;
function stage(w) {
  const p = prByNum(w.pr);
  if (!p) return 'none';
  if (p.state === 'merged') return 'merged';
  return p.review === 'none' ? 'open' : 'review';
}

const stChip = (st, why) => st === 'noai' ? '<span class="st done">AI なし</span>' : '<span class="st ' + st + '">' + (st === 'run' ? '<i class="spin"></i>' : st === 'wait' ? '<i class="dot"></i>' : '') + ST_LABEL[st] + (why ? '：' + why : '') + '</span>';
const aiLine = w => '<div class="ai">' + (aiSessions(w).map(s => '<span class="' + s.st + '">' + esc(s.n) + ' ' + ST_LABEL[s.st] + '</span>').join('') || '<span>AI のセッションはありません</span>') + '</div>';
const branch = b => '<span class="branch">' + ic('branch', 12) + '<span>' + esc(b) + '</span></span>';
const mainTag = w => w && w.main ? '<span class="maintag" title="リポジトリ本体の作業ツリー">メイン</span>' : '';
const btitle = b => '<span class="bt-title">' + ic('branch', 13) + '<span>' + esc(b) + '</span>' + mainTag(wtByBranch(b)) + '</span>';
const wtChip = b => '<button class="chip mono" data-act="open" data-v="' + esc(b) + '" data-tab="term" title="この worktree を開く">' + ic('branch', 12) + esc(b) + '</button>';
const av = (who, lg) => '<span class="av' + (lg ? ' lg' : '') + '" style="--h:' + (HUE[who] || 0) + '" title="' + who + '">' + who.slice(0, 2).toUpperCase() + '</span>';
const labels = ls => ls.map(l => '<span class="lab" style="--h:' + (LABEL_HUE[l] || 200) + '">' + l + '</span>').join(' ');
const issueLine = i => i ? '<div class="il"><span class="num">#' + i.id + '</span><span class="t">' + esc(i.title) + '</span></div>' : '<div class="il no">Issue なし</div>';
const PR_STATE = { open: 'Open', draft: 'Draft', merged: 'Merged' };
const CI = { run: ['pend', 'CI 実行中', '<i class="spin"></i>'], ok: ['ok', 'CI 成功', ic('check', 12)], fail: ['fail', 'CI 失敗', ic('x', 12)] };
function prChips(p) {
  if (!p) return '<span class="chips"><span class="chip none">PR なし</span></span>';
  let h = '<span class="chip ' + (p.state === 'draft' ? '' : p.state) + '">' + ic('pr', 12) + '#' + p.num + ' ' + PR_STATE[p.state] + '</span>';
  if (p.state !== 'merged') {
    const c = CI[p.ci];
    h += '<span class="chip ' + c[0] + '">' + c[2] + c[1] + '</span>';
    if (p.review === 'requested') h += '<span class="chip rev">レビュー依頼中</span>';
    if (p.review === 'approved') h += '<span class="chip ok">' + ic('check', 12) + 'Approve 済み</span>';
  }
  h += '<span class="chip who" title="PR の作成者">' + av(p.author) + (p.author === ME ? '' : p.author) + '</span>';
  return '<span class="chips">' + h + '</span>';
}
function termHtml(ls, cursor) {
  return ls.map((l, i) => {
    const k = l.indexOf('|'), has = k === 0 || k === 1;
    const cls = has ? l.slice(0, k) : '';
    let txt = esc(has ? l.slice(k + 1) : l);
    if (cls === 's') txt = txt.replace(/^(\S)/, '<span class="sp-ch">$1</span>');
    if (cursor && i === ls.length - 1) txt += '<span class="cur"></span>';
    return '<div class="' + (cls === '$' ? 'g' : cls) + '">' + txt + '</div>';
  }).join('');
}
function cmdTerm(w, s) {
  const pr = wtPath(w.branch) + ' $ ';
  if (/dev/.test(s.n)) return lines('$|' + pr + s.n + '\n|\no|VITE v6.3.2  ready in 412 ms\n|\ng|  ➜  Local:   http://localhost:' + (5173 + repo().wts.indexOf(w)) + '/\nd|  ➜  Network: use --host to expose\n|\nd|14:02:11 [vite] hmr update /src/App.tsx\nd|14:06:48 [vite] hmr update /src/styles/tokens.css\nd|14:06:52 [vite] page reload src/main.tsx');
  if (/test|watch/.test(s.n)) return lines('$|' + pr + s.n + '\n|\ng| ✓ src/server/export/filter.test.ts (4)\ng| ✓ src/server/export/csv.test.ts (5)\n|\no|Test Files  2 passed (2)\no|     Tests  9 passed (9)\n|\nd| PASS  Waiting for file changes...\nd|       press h to show help, press q to quit');
  return lines('$|' + pr + 'git status -sb\no|## ' + w.branch + (w.dirty ? '\no| M ' + ((w.diff[0] || {}).path || 'README.md') : '') + '\n$|' + pr);
}

/* ================= bar + rail ================= */
function renderBar() {
  $('repoBtn').innerHTML = esc(S.repo) + ic('caret', 12);
  $('repoMenu').innerHTML = Object.keys(REPOS).map(n => {
    const r = REPOS[n], wc = waitCount(r);
    return '<button data-act="repo" data-v="' + n + '" aria-current="' + (n === S.repo) + '"><span class="nm">' + n + '</span><span class="ct">worktree ' + r.wts.length + '</span>' + (wc ? '<span class="st wait" style="box-shadow:none"><i class="dot"></i>入力待ち ' + wc + '</span>' : '') + '</button>';
  }).join('') + '<button class="add">＋ リポジトリを追加</button>';
  const L = [['list', '一覧＋詳細', IC.list], ['tiles', 'タイル', IC.grid], ['board', 'ボード', IC.board]];
  $('seg').hidden = S.view !== 'wt';
  $('seg').innerHTML = L.map(l => '<button data-act="layout" data-v="' + l[0] + '" aria-pressed="' + (S.layout === l[0]) + '">' + l[2] + l[1] + '</button>').join('');
  const all = Object.values(REPOS).reduce((a, r) => a + waitCount(r), 0), here = waitCount(repo());
  $('alert').innerHTML = all
    ? '<span class="alert"><i class="dot"></i>入力待ち ' + here + ' 件' + (all > here ? '<span class="ex">（他のリポジトリに ' + (all - here) + ' 件）</span>' : '') + '</span>'
    : '<span class="alert none">入力待ちはありません</span>';
  const V = [['wt', 'worktree', 'branch', repo().wts.length], ['issue', 'Issue', 'issue', openIssues().length], ['pr', 'PR', 'pr', openPrs().length]];
  $('rail').innerHTML = V.map(v => '<button data-act="view" data-v="' + v[0] + '" aria-current="' + (S.view === v[0]) + '">' + ic(v[2], 18) + '<span>' + v[1] + '</span><span class="n">' + v[3] + '</span>' + (v[0] === 'wt' && here ? '<i class="wd" title="入力待ちがあります"></i>' : '') + '</button>').join('') +
    '<span class="sp"></span><button data-act="set-open" title="設定" aria-label="設定">' + ic('gear', 18) + '<span>設定</span></button>';
}

/* ================= worktree: list + detail ================= */
function renderList() {
  const w0 = cur();
  const rows = repo().wts.map(w => {
    const st = agg(w), p = prByNum(w.pr);
    return '<button class="row ' + st + (w.main ? ' mainrow' : '') + '" role="option" aria-selected="' + (w === w0) + '" data-act="sel" data-v="' + esc(w.branch) + '">' +
      '<div class="l1">' + btitle(w.branch) + stChip(st) + '</div>' +
      '<div class="l2">' + issueLine(issueById(w.issue)) + '</div>' +
      '<div class="l3">' + aiLine(w) + (st === 'wait' ? '<span class="why">' + whyOf(w) + '</span>' : '') + '</div>' +
      '<div class="l3">' + prChips(p) + '</div></button>';
  }).join('');
  return '<div class="ld"><aside class="list"><div class="list-h">worktree <small>' + repo().wts.length + ' 件</small></div>' +
    '<div class="rows" role="listbox" aria-label="worktree の一覧">' + rows + '</div>' +
    '<div class="list-f"><button class="btn" data-act="new">＋ 新しい worktree</button></div></aside>' + detail(w0) + '</div>';
}
function missing(a, w) {
  if (/\{\{issue\./.test(a.cmd) && !w.issue) return 'この worktree には Issue がないので使えません';
  if (/\{\{pr\./.test(a.cmd) && !w.pr) return 'この worktree には PR がないので使えません';
  return '';
}
function actionRow(w) {
  return '<div class="acts">' + actionsHere().map(a => {
    const m = missing(a, w);
    return '<button class="act"' + (m ? ' disabled' : '') + ' title="' + esc(m || fullCmd(a)) + '">' + IC[a.ic] + a.name + '</button>';
  }).join('') + '<button class="act add" data-act="set-open" title="ボタンを追加（設定を開く）" aria-label="ボタンを追加">＋</button></div>';
}
function detail(w) {
  const st = agg(w), i = issueById(w.issue), p = prByNum(w.pr);
  const T = [['issue', 'Issue', i ? '<span class="cnt">#' + i.id + '</span>' : ''], ['term', 'ターミナル', st === 'wait' ? '<i class="wd" title="入力待ち"></i>' : '<span class="cnt">' + w.sessions.length + '</span>'], ['diff', '差分', '<span class="cnt">' + w.diff.length + '</span>'], ['pr', 'PR', p ? '<span class="cnt">#' + p.num + '</span>' : '']];
  const body = S.tab === 'issue' ? (i ? issuePage(i) : noIssue(w)) : S.tab === 'term' ? termTab(w) : S.tab === 'diff' ? diffTab(w) : (p ? prPage(p) : noPr(w));
  return '<section class="detail"><div class="dh">' +
    '<div class="top"><h1>' + ic('branch', 15) + '<span>' + esc(w.branch) + '</span>' + mainTag(w) + '</h1>' + stChip(st, st === 'wait' ? whyOf(w) : '') +
    (w.main ? '' : '<button class="btn sm del" data-act="del" data-v="' + esc(w.branch) + '">' + IC.trash + '削除</button>') + '</div>' +
    '<div class="meta">' + issueLine(i) + prChips(p) + (p && p.author !== ME ? '<span class="chip rev">レビュー用にチェックアウト</span>' : '') + '<span class="mono" title="worktree の場所">' + esc(wtPath(w.branch)) + '</span></div>' +
    actionRow(w) +
    '<div class="tabs" role="tablist">' + T.map(t => '<button role="tab" aria-selected="' + (S.tab === t[0]) + '" data-act="tab" data-v="' + t[0] + '">' + t[1] + t[2] + '</button>').join('') + '</div>' +
    '</div><div class="body">' + body + '</div></section>';
}
const noIssue = w => '<div class="empty"><b>この worktree には Issue が紐づいていません</b><span>Issue がなくても作業は続けられます。あとから紐づけることも、ここから新しく作ることもできます。</span><div class="bs"><button class="btn pri">Issue を紐づける</button><button class="btn">Issue を作成</button></div></div>';
function noPr(w) {
  const i = issueById(w.issue);
  if (w.main) return '<div class="empty"><b>メインの作業ツリーには PR がありません</b><span>PR を出す変更は、ブランチごとの worktree で作業します。</span><div class="bs"><button class="btn pri" data-act="new">＋ 新しい worktree</button></div></div>';
  return '<div class="empty"><b>この worktree にはまだ PR がありません</b><span>ブランチ <code>' + esc(w.branch) + '</code> を push して PR を作成します。' + (i ? 'Issue #' + i.id + ' は自動でリンクされます。' : '') + '</span>' +
    '<div class="form"><div class="field">' + esc(i ? i.title : w.branch) + '</div><div class="field" style="min-height:70px;color:var(--muted)">' + (i ? 'Closes #' + i.id : '説明を書く…') + '</div><div class="reply-a" style="margin:0"><button class="btn">Draft で作成</button><button class="btn ok">PR を作成</button></div></div></div>';
}
const comment = (who, when, html, first) => '<div class="cm">' + av(who, 1) + '<div class="box"><div class="hd"><b>' + who + '</b> が' + when + 'に' + (first ? '作成' : 'コメント') + '</div><div class="tx">' + html + '</div></div></div>';
const replyBox = btns => '<div class="cm">' + av(ME, 1) + '<div><div class="reply">コメントを書く…</div><div class="reply-a">' + btns + '</div></div></div>';
const sideWts = (wts, newAttr) => '<section><h3>worktree</h3>' + (wts.length ? wts.map(w => '<div class="li">' + wtChip(w.branch) + '</div>').join('') : '<div style="color:var(--faint);margin-bottom:6px">まだありません</div>') + '<button class="btn sm" data-act="new" ' + newAttr + '>worktree を作成</button></section>';

function issuePage(i) {
  const wts = repo().wts.filter(w => w.issue === i.id), prs = repo().prs.filter(p => p.issue === i.id), a = asg(i), closed = i.state === 'closed';
  return '<div class="page"><div class="ph"><h2>' + esc(i.title) + ' <span class="num" style="font-size:15px">#' + i.id + '</span></h2><span class="big' + (closed ? ' closed' : '') + '">' + (closed ? 'Closed' : 'Open') + '</span><span style="color:var(--muted)"><b style="color:var(--text)">' + i.author + '</b> が' + i.opened + 'に作成、コメント ' + i.comments.length + ' 件</span></div>' +
    '<div>' + comment(i.author, i.opened, i.body, 1) +
    i.comments.map(c => comment(c[0], c[1], c[2])).join('') +
    prs.map(p => '<div class="ev">' + ic('pr', 13) + '<span><b>' + p.author + '</b> がこの Issue を PR <b>#' + p.num + '</b> にリンク</span></div>').join('') +
    (closed ? '<div class="ev">' + ic('check', 13) + '<span>PR のマージで Close されました</span></div>' : replyBox('<button class="btn">Issue を Close</button><button class="btn pri">コメントする</button>')) + '</div>' +
    '<aside class="side">' +
    '<section><h3>Assignees</h3>' + (a ? '<div class="li">' + av(a) + a + '</div>' : '<span style="color:var(--faint)">未指定</span>') + '</section>' +
    '<section><h3>ラベル</h3>' + labels(i.labels) + '</section>' +
    '<section><h3>リンクされた PR</h3>' + (prs.length ? prs.map(p => '<div class="li" style="margin-bottom:8px">' + prChips(p) + '</div>').join('') : '<span style="color:var(--faint)">まだありません</span>') + '</section>' +
    sideWts(wts, 'data-issue="' + i.id + '"') + '</aside></div>';
}

/* terminal */
function termTab(w) {
  const si = Math.min(S.sess, w.sessions.length - 1);
  const other = w.sessions.findIndex((s, i) => i !== si && !s.ai);
  const two = S.split && w.sessions.length > 1;
  const oi = other >= 0 ? other : (si + 1) % w.sessions.length;
  const mainIdx = Math.max(0, w.sessions.findIndex(x => x.ai));
  const pane = i => {
    const s = w.sessions[i], main = i === mainIdx;
    const ls = main ? w.term : s.ai ? lines('u|› この PR の差分をレビューして\na|• 重大な問題は見つかりませんでした。件名の文言が変わっていないことを、スナップショットテストで固定することを勧めます。\nd|\nd|セッションを終了しました（13:47）') : cmdTerm(w, s);
    const running = s.ai ? s.st === 'run' : /dev|watch/.test(s.n);
    return '<div class="pane"><div class="pt">' + IC.term + '<span>' + esc(s.n) + '</span>' + (s.ai ? stChip(s.st, s.st === 'wait' ? s.why : '') : '<span>' + (running ? '実行中のコマンド' : 'シェル') + '</span>') + '</div>' +
      '<div class="term">' + termHtml(ls, main ? w.cursor && !running : !s.ai && !running) + '</div></div>';
  };
  return '<div class="tw"><div class="stabs" role="tablist">' +
    w.sessions.map((s, i) => '<button class="s" role="tab" aria-selected="' + (i === si) + '" data-act="sess" data-v="' + i + '">' + (s.ai ? '<i class="dot ' + s.st + '"></i>' : IC.term) + esc(s.n) + (s.ai ? ' <span class="' + s.st + '">' + ST_LABEL[s.st] + '</span>' : '') + '</button>').join('') +
    '<button class="s" title="セッションを追加" aria-label="セッションを追加">＋</button>' +
    '<button class="btn sm sp" data-act="split" aria-pressed="' + S.split + '">' + IC.split + (S.split ? '分割を解除' : '左右に分割') + '</button></div>' +
    '<div class="panes' + (two ? ' split' : '') + '">' + pane(si) + (two ? pane(oi) : '') + '</div></div>';
}

/* diff */
function fileHtml(f, review) {
  const m = /^@@ -(\d+),?\d* \+(\d+)/.exec(f.lines[0]) || [0, 1, 1];
  let a = +m[1], b = +m[2], h = '';
  f.lines.forEach((l, i) => {
    const k = l[0];
    if (k === '@') h += '<div class="dl hunk"><span class="n"></span><span class="n"></span><span class="c">' + esc(l) + '</span></div>';
    else if (k === '+') h += '<div class="dl add"><span class="n"></span><span class="n">' + (b++) + '</span><span class="c">' + esc(l) + '</span></div>';
    else if (k === '-') h += '<div class="dl del"><span class="n">' + (a++) + '</span><span class="n"></span><span class="c">' + esc(l) + '</span></div>';
    else h += '<div class="dl"><span class="n">' + (a++) + '</span><span class="n">' + (b++) + '</span><span class="c">' + esc(l || ' ') + '</span></div>';
    if (review && f.comment && f.comment.at === i) {
      h += '<div class="rc">' + f.comment.thread.map(c => '<div class="one">' + av(c[0]) + '<div><b>' + c[0] + '</b><small>' + c[1] + '</small><div>' + c[2] + '</div></div></div>').join('') +
        '<div class="field">返信を書く…</div><div class="reply-a" style="justify-content:flex-start"><button class="btn sm">返信する</button><button class="btn sm">解決済みにする</button></div></div>';
    }
  });
  return '<div class="file' + (review ? ' rv' : '') + '"><div class="fh"><span class="p">' + esc(f.path) + '</span><span class="plus">+' + f.add + '</span><span class="minus">−' + f.del + '</span>' + (review ? '<label style="font-family:var(--ui);font-weight:500;color:var(--muted)"><input type="checkbox"> Viewed</label>' : '') + '</div>' + h + '</div>';
}
function diffSum(diff, lead, tail) {
  const add = diff.reduce((a, f) => a + f.add, 0), del = diff.reduce((a, f) => a + f.del, 0);
  return '<div class="dsum">' + lead + '<span><b>' + diff.length + '</b> ファイル</span><span class="plus">+' + add + '</span><span class="minus">−' + del + '</span>' + (tail || '') + '</div>';
}
function diffTab(w) {
  if (!w.diff.length) return '<div class="empty"><b>差分はありません</b><span>' + (w.main ? '未コミットの変更はありません。' : 'この worktree の内容は <code>main</code> と同じです。') + '</span></div>';
  return '<div class="dwrap">' + diffSum(w.diff, '<span>worktree の現在の内容と <code>main</code> の差分（未コミットの変更 ' + w.dirty + ' ファイルを含む）</span>') +
    '<div class="flist">' + w.diff.map(f => '<div><span class="p">' + esc(f.path) + '</span><span class="plus">+' + f.add + '</span><span class="minus">−' + f.del + '</span></div>').join('') + '</div>' +
    w.diff.map(f => fileHtml(f, false)).join('') + '</div>';
}

/* PR page */
function checksBox(p) {
  const rows = p.ci === 'ok' ? [['ok', 'lint', '18秒'], ['ok', 'typecheck', '41秒'], ['ok', 'test', '2分 6秒'], ['ok', 'build', '1分 12秒']]
    : p.ci === 'fail' ? [['ok', 'lint', '17秒'], ['ok', 'typecheck', '39秒'], ['fail', 'test', '1 件失敗'], ['ok', 'build', '1分 10秒']]
    : [['ok', 'lint', '18秒'], ['ok', 'typecheck', '40秒'], ['pend', 'test', '実行中'], ['pend', 'build', '実行中']];
  const head = p.ci === 'ok' ? 'すべてのチェックが成功' : p.ci === 'fail' ? '失敗したチェックがあります' : 'チェックを実行中';
  const m = k => k === 'ok' ? '<span class="ic-ok">' + IC.check + '</span>' : k === 'fail' ? '<span class="ic-fail">' + IC.x + '</span>' : '<span class="ic-pend"><i class="spin"></i></span>';
  return '<div class="r h">' + m(p.ci === 'run' ? 'pend' : p.ci) + '<span class="t">' + head + '</span><small>CI（GitHub Actions）</small></div>' +
    rows.map(r => '<div class="r">' + m(r[0]) + '<span class="t mono">' + r[1] + '</span><small>' + r[2] + '</small></div>').join('');
}
function prPage(p) {
  const w = wtByBranch(p.branch), i = issueById(p.issue), diff = w ? w.diff : (p.diff || []), mine = p.author === ME;
  const head = '<div class="ph" style="margin:16px 18px 0;border:0;padding:0"><h2>' + esc(p.title) + ' <span class="num" style="font-size:15px">#' + p.num + '</span></h2><span class="big ' + p.state + '">' + PR_STATE[p.state] + '</span><span style="color:var(--muted);display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">' + av(p.author) + '<span><b style="color:var(--text)">' + p.author + '</b> が <code>main</code> ← <code>' + esc(p.branch) + '</code> に ' + p.commits.length + ' コミットを' + (p.state === 'merged' ? 'マージしました' : 'マージしようとしています') + '</span></span></div>';
  const sub = '<div class="sub" role="tablist">' + [['conv', 'Conversation', ''], ['files', 'Files changed', '<span class="cnt">' + diff.length + '</span>']].map(t => '<button role="tab" aria-selected="' + (S.prTab === t[0]) + '" data-act="prtab" data-v="' + t[0] + '">' + t[1] + t[2] + '</button>').join('') + '</div>';
  if (S.prTab === 'files') {
    return head + sub + '<div class="dwrap">' + diffSum(diff, '', '<span class="grow"></span><span>行にカーソルを置くと、レビューコメントを追加するボタンが出ます</span><button class="btn sm ok">変更をレビュー' + ic('caret', 12) + '</button>') +
      (diff.length ? diff.map(f => fileHtml(f, true)).join('') : '<div class="empty"><span>このモックでは、この PR の差分は用意していません。</span></div>') + '</div>';
  }
  const rv = p.reviewers.map(r => '<div class="li">' + av(r[0]) + '<span style="flex:1">' + r[0] + '</span>' + (r[1] === 'approved' ? '<span class="ic-ok" title="Approve 済み">' + IC.check + '</span>' : '<span class="ic-pend" title="レビュー待ち"><i class="dot"></i></span>') + '</div>').join('') || '<span style="color:var(--faint)">未指定</span>';
  const canMerge = p.state === 'open' && p.ci === 'ok' && p.review === 'approved';
  const why = p.state === 'draft' ? 'Draft の PR はマージできません。' : p.ci === 'fail' ? 'CI が失敗しています。' : p.ci === 'run' ? 'CI の完了を待っています。' : p.review !== 'approved' ? 'レビューで Approve されるのを待っています。' : 'コンフリクトはありません。マージできます。';
  const mergeBox = p.state === 'merged'
    ? '<div class="mg"><span class="ic-mg">' + IC.pr + '</span><span style="flex:1"><b>マージ済み</b>　昨日 <code>main</code> にマージされました。</span>' + (w ? '<button class="btn sm del" data-act="del" data-v="' + esc(w.branch) + '">worktree を削除</button>' : '') + '</div>'
    : '<div class="mg"><button class="btn ' + (canMerge ? 'ok' : '') + '"' + (canMerge ? '' : ' disabled') + '>PR をマージ' + ic('caret', 12) + '</button><span style="color:var(--muted);flex:1">' + why + '</span>' + (p.state === 'draft' && mine ? '<button class="btn sm">Ready for review にする</button>' : '') + '</div>';
  const needMe = p.reviewers.some(r => r[0] === ME && r[1] === 'requested');
  return head + sub + '<div class="page" style="padding-top:16px"><div>' +
    comment(p.author, '', '<p>' + esc(p.title) + '。</p>' + (i ? '<p>Closes #' + i.id + '</p>' : ''), 1).replace('がに作成', 'が作成') +
    p.commits.map(c => '<div class="ev">' + ic('branch', 13) + '<span class="sha">' + c[0] + '</span><span>' + esc(c[1]) + '</span></div>').join('') +
    (p.reviewers.length ? '<div class="ev">' + ic('review', 13) + '<span><b>' + p.author + '</b> が <b>' + p.reviewers.map(r => r[0]).join('</b>、<b>') + '</b> にレビューを依頼</span></div>' : '') +
    diff.filter(f => f.comment && f.comment.thread[0][1] !== '下書き').map(f => comment(f.comment.thread[0][0], f.comment.thread[0][1], '<p style="color:var(--muted);font-size:12px"><code>' + esc(f.path) + '</code> へのレビューコメント</p><p>' + f.comment.thread[0][2] + '</p>')).join('') +
    p.reviewers.filter(r => r[1] === 'approved').map(r => '<div class="ev okc">' + IC.check + '<span><b>' + r[0] + '</b> が Approve</span></div>').join('') +
    '<div class="box2">' + checksBox(p) + '</div><div class="box2">' + mergeBox + '</div>' +
    (p.state === 'merged' ? '' : replyBox((mine ? '<button class="btn">PR を Close</button>' : '') + '<button class="btn pri">コメントする</button>' + (needMe ? '<button class="btn ok">Approve</button>' : ''))) + '</div>' +
    '<aside class="side"><section><h3>Reviewers</h3>' + rv + '</section>' +
    '<section><h3>Assignees</h3><div class="li">' + av(p.author) + p.author + '</div></section>' +
    '<section><h3>ラベル</h3>' + (i ? labels(i.labels) : '<span style="color:var(--faint)">なし</span>') + '</section>' +
    '<section><h3>リンクされた Issue</h3>' + (i ? '<div class="li"><span class="num">#' + i.id + '</span><span class="t">' + esc(i.title) + '</span></div>' : '<span style="color:var(--faint)">なし</span>') + '</section>' +
    (w ? '<section><h3>worktree</h3><div class="li">' + wtChip(w.branch) + '</div></section>' : sideWts([], 'data-pr="' + p.num + '"')) + '</aside></div>';
}

    ? '<div class="what"><span class="chip">' + IC[a.ai] + AIS[a.ai].name + '</span>' + (a.cmd ? '<span class="lb">最初の指示</span><code>' + esc(a.cmd) + '</code>' : '<span class="lb">最初の指示なし</span>') + '</div>'
    : '<code>' + esc(a.cmd) + '</code>';
  const rows = ACTIONS.map(a => '<tr><td class="grip" title="ドラッグして並べ替え">' + IC.grip + '</td><td><span class="ic">' + IC[a.ic] + '</span></td><td><b>' + a.name + '</b></td><td><span class="kind ' + a.kind + '">' + (a.kind === 'ai' ? 'AI' : 'コマンド') + '</span></td><td>' + what(a) + '</td><td>' + (a.scope === ALL ? a.scope : '<span class="mono">' + a.scope + '</span>') + '</td><td><div class="ops"><button class="btn sm">編集</button><button class="btn sm del">削除</button></div></td></tr>').join('');
  const edit = '<tr class="edit"><td class="grip">' + IC.grip + '</td><td><button class="ic" title="アイコンを選ぶ" aria-label="アイコンを選ぶ">' + IC.review + '</button></td><td><input value="/review-pr" aria-label="名前"></td>' +
    '<td><select aria-label="種類"><option selected>AI</option><option>コマンド</option></select></td>' +
    '<td><div class="what"><select aria-label="AI" style="width:140px"><option selected>Claude Code</option><option>Codex</option><option>Antigravity</option></select><input class="mono" value="/review-pr {{pr.url}}" aria-label="最初の指示" placeholder="最初の指示（空でもよい）"></div></td>' +
    '<td>' + scopeSel(ALL) + '</td><td><div class="ops"><button class="btn sm pri">保存</button><button class="btn sm">キャンセル</button></div></td></tr>';
  const PH = [['worktree.path', 'worktree のパス'], ['branch', 'ブランチ名'], ['issue.number', 'Issue の番号'], ['issue.url', 'Issue の URL'], ['issue.title', 'Issue のタイトル'], ['pr.number', 'PR の番号'], ['pr.url', 'PR の URL']];
  $('setC').innerHTML = '<h2>AI の起動コマンド</h2><p>AI を起動するときに実行するコマンドです。初期設定はオプションなしのコマンドで、オプションを付けたいときはここを書き換えます。種類が「AI」のボタンは、ここのコマンドに「最初の指示」を付けて実行します。</p>' +
    '<table class="bt" style="max-width:860px"><thead><tr><th style="width:64px"></th><th style="width:150px">AI</th><th>起動コマンド</th><th style="width:150px"></th></tr></thead><tbody>' +
    Object.keys(AIS).map(k => '<tr><td><span class="ic">' + IC[k] + '</span></td><td><b>' + AIS[k].name + '</b></td><td><input class="mono" value="' + esc(AIS[k].cmd) + '" aria-label="' + AIS[k].name + ' の起動コマンド"><div class="defl">初期設定: <code>' + AIS[k].def + '</code>' + (AIS[k].cmd !== AIS[k].def ? '<span class="chg">変更済み</span>' : '') + '</div></td><td><div class="ops"><button class="btn sm"' + (AIS[k].cmd === AIS[k].def ? ' disabled' : '') + '>初期設定に戻す</button></div></td></tr>').join('') + '</tbody></table>' +
    '<h2 style="margin-top:30px">アクションボタン</h2><p>worktree ごとに並ぶボタンです。押すと、その worktree をカレントディレクトリにして、アプリ内のターミナルで実行します。種類は2つあります。「AI」は上の起動コマンドで AI を起動し、最初の指示があればそれを渡します。「コマンド」は書いたコマンドをそのまま実行します。</p>' +
    '<div class="prev"><span><span class="mono">' + S.repo + '</span> での表示</span><div class="acts">' + actionsHere().map(a => '<span class="act">' + IC[a.ic] + a.name + '</span>').join('') + '</div></div>' +
    '<table class="bt"><thead><tr><th style="width:30px"></th><th style="width:80px">アイコン</th><th style="width:150px">名前</th><th style="width:96px">種類</th><th>実行する内容</th><th style="width:200px">対象</th><th style="width:150px"></th></tr></thead><tbody>' + rows + edit + '</tbody></table>' +
    '<div style="margin-top:12px"><button class="btn">＋ ボタンを追加</button></div>' +
    '<div class="ph-note"><h3>最初の指示とコマンドで使えるプレースホルダー</h3><dl>' + PH.map(x => '<dt><code>{{' + x[0] + '}}</code></dt><dd>' + x[1] + '</dd>').join('') + '</dl>' +
    '<p>ボタンを押した worktree の値に置き換えてから実行します。値がない worktree（Issue や PR がまだない worktree）では、そのプレースホルダーを使うボタンは押せなくなります。</p></div>';
}

/* ================= render + events ================= */
function render() {
  renderBar();
  $('main').innerHTML = S.view === 'issue' ? renderIssues() : S.view === 'pr' ? renderPrs() : S.layout === 'list' ? renderList() : S.layout === 'tiles' ? renderTiles() : renderBoard();
}
function act(t) {
  const a = t.dataset.act, v = t.dataset.v;
  if (a === 'repo-menu') { $('repoMenu').hidden = !$('repoMenu').hidden; return; }
  if (a === 'new') { showNew(t.dataset.issue, t.dataset.pr); return; }
  if (a === 'del') { showDelete(v); return; }
  if (a === 'dlg-close') { $('dlgOv').hidden = true; return; }
  if (a === 'set-open') { renderSettings(); $('setOv').hidden = false; return; }
  if (a === 'set-close') { $('setOv').hidden = true; return; }
  if (a === 'repo') { S.repo = v; S.sess = 0; S.prTab = 'conv'; $('repoMenu').hidden = true; }
  if (a === 'view') { S.view = v; S.prTab = 'conv'; }
  if (a === 'layout') S.layout = v;
  if (a === 'sel') { S.sel[S.repo] = v; S.sess = 0; S.prTab = 'conv'; }
  if (a === 'open') { S.sel[S.repo] = v; S.sess = 0; S.prTab = 'conv'; S.tab = t.dataset.tab; S.view = 'wt'; S.layout = 'list'; }
  if (a === 'isel') S.isel[S.repo] = +v;
  if (a === 'psel') { S.psel[S.repo] = +v; S.prTab = 'conv'; }
  if (a === 'tab') S.tab = v;
  if (a === 'prtab') S.prTab = v;
  if (a === 'sess') S.sess = +v;
  if (a === 'split') S.split = !S.split;
  render();
}
document.addEventListener('click', e => {
  if (!e.target.closest('.repo')) $('repoMenu').hidden = true;
  if (e.target.id === 'dlgOv') { $('dlgOv').hidden = true; return; }
  const t = e.target.closest('[data-act]');
  if (t) act(t);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('dlgOv').hidden = true; $('setOv').hidden = true; $('repoMenu').hidden = true; }
  if (e.key === 'Enter' && e.target.matches('div[data-act]')) act(e.target);
});
render();
</script>
</body>
</html>
