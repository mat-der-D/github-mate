<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>github-mate — worktree</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fcfcfa;
  --side: #f2f3ef;
  --line: #e2e4de;
  --ink: #1c201e;
  --ink2: #58605b;
  --ink3: #8a918c;
  --hover: #e9ebe5;
  --sel: #e0e3dc;
  --band: #f1f2ee;
  --need: #b05a00;
  --bad: #cf222e;
  --add: #24744a;
  --add-bg: #e4f3e9;
  --del: #b03535;
  --del-bg: #fbe9e7;
  --shadow: 0 8px 28px rgba(28, 32, 30, .14), 0 0 0 1px rgba(28, 32, 30, .08);
  --ui: "Inter", "SF Pro Text", "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, "DejaVu Sans Mono", "Noto Sans Mono CJK JP", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161918;
    --side: #1c201f;
    --line: #2a2f2d;
    --ink: #e2e5e1;
    --ink2: #a1a9a4;
    --ink3: #6d7570;
    --hover: #242928;
    --sel: #2c3230;
    --band: #1f2423;
    --need: #eda64e;
    --bad: #ff7b72;
    --add: #7cc596;
    --add-bg: #1b2e23;
    --del: #e79090;
    --del-bg: #3a2020;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: clamp(256px, 20vw, 292px) minmax(0, 1fr) auto;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 4px; }
svg { flex: none; display: block; }
.mono { font-family: var(--mono); }

/* ---------- 状態マーク ---------- */
.mark { width: 10px; height: 10px; flex: none; display: inline-grid; place-items: center; color: var(--ink3); }
.mark.need::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--need); }
.mark.seen::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--need); }
.mark.need.bad::before { background: var(--bad); }
.mark.seen.bad::before { border-color: var(--bad); }
.pip { width: 6px; height: 6px; border-radius: 50%; background: var(--need); flex: none; }
.pip.bad { background: var(--bad); }
.pip[hidden] { display: none; }
.mark.wait::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.mark.run::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink2); border-right-color: transparent; animation: rot 1.5s linear infinite; }
.mark.done svg { width: 10px; height: 10px; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mark.run::before, .cur { animation: none !important; } }

/* ---------- サイドバー ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-top { display: flex; align-items: center; gap: 4px; padding: 10px 10px 4px; }
.repo { flex: 1; min-width: 0; }
.repo > summary, .more > summary { list-style: none; cursor: pointer; }
.repo > summary::-webkit-details-marker, .more > summary::-webkit-details-marker { display: none; }
.repo > summary { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 6px; font-weight: 600; }
.repo > summary:hover, .icon-btn:hover { background: var(--hover); }
.repo > summary .dim { color: var(--ink3); font-weight: 400; }
.repo > summary svg { color: var(--ink3); margin-left: auto; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--ink2); flex: none; }
details { position: relative; }
.pop { position: absolute; z-index: 20; top: calc(100% + 4px); min-width: 220px; padding: 4px; background: var(--bg); border-radius: 8px; box-shadow: var(--shadow); }
.pop.right { right: 0; }
.pop button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border-radius: 5px; white-space: nowrap; }
.pop button:hover:not(:disabled) { background: var(--hover); }
.pop button:disabled { color: var(--ink3); }
.pop button svg { color: var(--ink2); }
.pop button .end { margin-left: auto; color: var(--ink3); font-size: 12px; }
.pop button .end.need { color: var(--need); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.pop .danger, .pop .danger svg { color: var(--del); }

.nav { display: flex; gap: 2px; padding: 2px 10px 10px; border-bottom: 1px solid var(--line); }
.nav button { height: 28px; padding: 0 8px; border-radius: 6px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.nav button:hover { background: var(--hover); }
.nav .cnt { font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.nav button[aria-current] { color: var(--ink); font-weight: 600; background: var(--sel); }

.list { flex: 1; min-height: 0; overflow-y: auto; padding: 0; }
.grp { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 18px; font-size: 11.5px; color: var(--ink3); background: var(--band); border-bottom: 1px solid var(--line); }
.grp.need { color: var(--ink); font-weight: 600; }
.grp .un { margin-left: auto; font-weight: 400; color: var(--ink2); }
.row { display: grid; position: relative; grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-rows: 20px 18px; align-content: center; column-gap: 2px; align-items: center; width: 100%; height: 54px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--hover); }
.row[aria-selected="true"] { background: var(--sel); }
.row .br { grid-column: 2 / 4; grid-row: 1; font: 400 12.5px/20px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .br i { font-style: normal; color: var(--ink3); font-weight: 400; }
.row .why { grid-column: 2; display: flex; align-items: center; gap: 7px; height: 18px; font-size: 12px; line-height: 18px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ref { font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; padding-left: 8px; }
.row .why { grid-row: 2; }
.row .ref { grid-column: 3; grid-row: 2; }
.row .del { position: absolute; right: 12px; top: 5px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--ink3); background: var(--side); box-shadow: -8px 0 6px var(--side); opacity: 0; }
.row:hover .del { background: var(--hover); box-shadow: -8px 0 6px var(--hover); }
.row[aria-selected="true"] .del { background: var(--sel); box-shadow: -8px 0 6px var(--sel); }
.row:hover .del, .row[aria-selected="true"] .del, .row.done .del, .row .del:focus-visible { opacity: 1; }
.row .del:hover { background: var(--del-bg) !important; color: var(--del); }
.row.need .why { color: var(--ink); }
.row.unread .br { font-weight: 600; }
.row.unread .why { color: var(--need); font-weight: 500; }
.row.unread.bad .why { color: var(--bad); }
.row .more { color: var(--ink3); font-size: 11.5px; font-weight: 400; }
.row.quiet .br { font-weight: 400; color: var(--ink2); }
.row.quiet .why { color: var(--ink3); }
.side-foot { padding: 8px 10px; border-top: 1px solid var(--line); }
.side-foot button { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--ink2); }
.side-foot button:hover { background: var(--hover); }

/* 設定の中の小見出し */
.dlg .note.bad, .fld .note.bad { color: var(--bad); }
.dlg .note.warnc, .fld .note.warnc { color: var(--need); }
.note.bad:empty { display: none; }
.set h3.sec { margin: 28px 0 4px; font-size: 14px; font-weight: 600; }

/* ---------- メイン ---------- */
.main { container-type: inline-size; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.head { display: flex; align-items: center; gap: 16px; padding: 16px 24px 10px; min-width: 0; }
.head-l { flex: 1; min-width: 0; }
.head h1 { margin: 0; font: 600 16px/1.4 var(--mono); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head h1 i { font-style: normal; font-weight: 400; color: var(--ink3); }
.meta { display: flex; gap: 4px; margin: 3px 0 0 -7px; min-width: 0; }
.meta button { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 7px; border-radius: 5px; color: var(--ink2); white-space: nowrap; min-width: 0; }
.meta button:first-child { flex: 0 1 auto; }
.meta button:not(:first-child) { flex: none; }
.meta button span { overflow: hidden; text-overflow: ellipsis; }
.meta button:hover { background: var(--hover); color: var(--ink); }
.meta button[aria-expanded="true"] { background: var(--sel); color: var(--ink); }
.meta button.none { color: var(--ink3); }
.meta .need { color: var(--need); font-weight: 500; }
.meta .bad { color: var(--bad); font-weight: 500; }
.meta .on { color: var(--ink); }
.meta .dim { color: var(--ink3); }
.meta .num { font-variant-numeric: tabular-nums; }
.btn { height: 30px; padding: 0 12px; border-radius: 6px; font-weight: 500; white-space: nowrap; flex: none; border: 1px solid var(--line); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; background: var(--ink); }
.btn:disabled { color: var(--ink3); background: none; }

.acts { display: flex; align-items: flex-start; padding: 0 16px 8px 17px; border-bottom: 1px solid var(--line); }
.acts-in { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; height: 30px; overflow: hidden; }
.act { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--ink2); white-space: nowrap; }
.act:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.act:disabled { color: var(--ink3); opacity: .55; }
.act.gap { margin-left: 10px; }

.tabs { display: flex; align-items: stretch; gap: 2px; padding: 8px 17px 0; border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; }
.tab { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 9px; color: var(--ink2); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; min-width: 0; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab b { font-weight: 500; }
.tab[aria-selected="true"] b { font-weight: 600; }
.tab .t { color: var(--ink3); overflow: hidden; text-overflow: ellipsis; }
.tab .st { font-size: 12px; color: var(--ink3); }
.tab .st.need { color: var(--need); font-weight: 500; }
.tab .st.bad { color: var(--bad); font-weight: 500; }
.tab .st.on { color: var(--ink2); }

@container (max-width: 600px) { .tab:not([aria-selected="true"]) .t { display: none; } }

.term { overflow-y: auto; padding: 18px 24px 24px; font: 12.5px/1.65 var(--mono); }
.term div { white-space: pre-wrap; word-break: break-word; min-height: 1.65em; }
.term .u { background: var(--band); margin: 6px -10px; padding: 3px 10px; border-radius: 4px; }
.term .a, .term .t { padding-left: 1.6em; text-indent: -1.6em; }
.term .a::before { content: "●  "; color: var(--ink3); }
.term .t::before { content: "●  "; color: var(--add); }
.term .t { font-weight: 600; }
.term .o { color: var(--ink2); padding-left: 3.6em; text-indent: -2em; }
.term .o::before { content: "⎿  "; color: var(--ink3); }
.term .r { color: var(--ink2); }
.term .m, .term .p { padding-left: 1.6em; }
.term .m { color: var(--del); background: var(--del-bg); }
.term .p { color: var(--add); background: var(--add-bg); }
.term .dm { color: var(--ink3); }
.term .e { color: var(--bad); }
.term .s { color: var(--ink2); margin-top: 6px; display: flex; align-items: center; gap: 10px; }
.term .sh b { font-weight: 400; color: var(--ink3); }
.term .box { margin: 12px -10px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink3); }
.term .box.live { border-color: var(--ink3); color: var(--ink); }
.cur { display: inline-block; width: .55em; height: 1.15em; vertical-align: -.2em; background: var(--ink); animation: blink 1.1s steps(1) infinite; }

/* ---------- Issue / PR / 差分 ---------- */
.drawer { width: clamp(380px, 33vw, 480px); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.drawer[hidden] { display: none; }
.d-head { display: flex; align-items: center; gap: 4px; padding: 12px 12px 0 22px; color: var(--ink2); }
.d-head .k { flex: 1; font-size: 12px; }
.d-body { flex: 1; overflow-y: auto; padding: 4px 22px 28px; }
.doc h2 { margin: 0 0 8px; font-size: 16px; line-height: 1.5; font-weight: 600; }
.doc h3 { margin: 26px 0 8px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.doc p { margin: 0 0 8px; } .doc ul { margin: 0 0 8px; padding-left: 20px; }
.doc code { font: 12px var(--mono); background: var(--band); padding: 1px 4px; border-radius: 3px; }
.sub { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--ink2); font-size: 12px; margin-bottom: 16px; }
.state { border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; font-weight: 500; color: var(--ink); line-height: 20px; }
.lab { display: inline-flex; align-items: center; gap: 5px; }
.lab::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) 45% 52%); }
.cm { border-top: 1px solid var(--line); padding: 12px 0 4px; }
.cm .who { font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.cm .who b { color: var(--ink); font-weight: 600; }
.cm .loc { font: 11.5px var(--mono); color: var(--ink3); margin-bottom: 4px; }
.chk { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
.chk .mark { transform: translateY(1px); }
.chk .n { font: 12px var(--mono); flex: none; }
.chk .x { color: var(--ink3); font-size: 12px; margin-left: auto; text-align: right; }
.chk.fail .n, .chk.fail .x { color: var(--bad); }
.mark.fail svg { color: var(--bad); width: 10px; height: 10px; }
.mark.ok svg { color: var(--add); width: 10px; height: 10px; }
.mergebar { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; color: var(--ink2); font-size: 12px; }
.cmt { display: flex; gap: 10px; padding: 3px 0; font-size: 12.5px; }
.cmt .mono { color: var(--ink3); font-size: 12px; }
.empty { padding: 48px 0; color: var(--ink2); }
.empty p { margin-bottom: 14px; }
.links { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-left: -6px; }
.links button { font: 12px var(--mono); padding: 2px 6px; border-radius: 4px; }
.links button:hover { background: var(--hover); }
.file { margin-top: 18px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.file-h { display: flex; gap: 10px; padding: 7px 10px; font: 12px var(--mono); background: var(--band); border-bottom: 1px solid var(--line); }
.file-h span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad { color: var(--add); } .dl { color: var(--del); }
.hunk { font: 11.5px/1.7 var(--mono); overflow-x: auto; padding: 4px 0; }
.hunk .l { white-space: pre; padding: 0 10px; min-width: max-content; }
.hunk .h { color: var(--ink3); }
.hunk .pl { background: var(--add-bg); color: var(--add); }
.hunk .mi { background: var(--del-bg); color: var(--del); }

/* ---------- 画面の切り替え、Issue / PR の全画面、設定 ---------- */
.main[hidden], .page[hidden], .scrim[hidden] { display: none; }
.side-foot button[aria-current] { background: var(--sel); color: var(--ink); font-weight: 600; }
.lctl { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.lctl:empty { display: none; }
.lctl .in { flex: 1; height: 28px; }
.row.nomark { grid-template-columns: 0 minmax(0, 1fr) auto; column-gap: 0; }
.row .br.tx { font-family: var(--ui); font-size: 13px; }
.row .why .q { color: var(--ink3); }
.row .ref { display: inline-flex; align-items: center; gap: 3px; }
.row.rr.unread .why .w { color: var(--need); font-weight: 500; }
.snav button { display: flex; align-items: center; width: 100%; height: 40px; padding: 0 18px; border-bottom: 1px solid var(--line); color: var(--ink2); }
.snav button:hover { background: var(--hover); }
.snav button[aria-current] { background: var(--sel); color: var(--ink); font-weight: 600; }

.page { grid-column: 2 / 4; min-width: 0; min-height: 0; overflow-y: auto; }
.p-head { display: flex; align-items: center; gap: 6px; max-width: 1080px; padding: 12px 24px 0 32px; color: var(--ink2); font-size: 12px; min-height: 46px; }
.p-head .k { flex: 1; }
.p-head .btn { font-size: 13px; margin-left: 6px; }
.p-body { max-width: 1080px; padding: 4px 32px 56px; }
.doc { container-type: inline-size; }
.doc-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
.doc-side .links { margin-bottom: 4px; }
@container (min-width: 760px) {
  .doc-grid { grid-template-columns: minmax(0, 1fr) 216px; column-gap: 48px; }
  .doc h2 { font-size: 20px; }
  .doc-side > h3:first-child { margin-top: 0; }
}
.doc .q { color: var(--ink3); }
.dtabs { display: flex; align-items: center; gap: 2px; margin: 0 0 18px -9px; border-bottom: 1px solid var(--line); }
.dtabs .sp { flex: 1; }
.dtabs .btn { height: 26px; font-size: 12px; margin-bottom: 4px; }
.links.ui button { font: inherit; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.links .num { color: var(--ink3); }
.in { height: 30px; min-width: 0; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; font: inherit; }
.in:focus { outline: none; border-color: var(--ink3); }
.in.mono { font: 12.5px var(--mono); }
.in[readonly] { color: var(--ink2); background: var(--band); }
textarea.in { display: block; width: 100%; height: auto; min-height: 68px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.reply { margin-top: 22px; }
.bar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.flist { margin: -6px 0 2px; }
.flist div { display: flex; gap: 10px; padding: 2px 0; font: 12px var(--mono); color: var(--ink2); }
.flist span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hunk.rv .l { position: relative; padding-left: 28px; }
.addc { position: absolute; left: 5px; top: 1px; width: 17px; height: 17px; display: grid; place-items: center; border-radius: 4px; background: var(--ink); color: var(--bg); opacity: 0; }
.hunk.rv .l:hover .addc, .addc:focus-visible { opacity: 1; }
.lthread { position: sticky; left: 0; padding: 0 12px 12px; margin: 2px 0; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 13px/1.5 var(--ui); white-space: normal; }
.lthread .cm:first-child { border-top: 0; }
.lthread .draft { padding-top: 12px; }
.rvw { margin-bottom: 4px; }
.rvw > summary { display: inline-flex; align-items: center; }
.p-head .more > summary { display: inline-flex; align-items: center; }
.popf { position: absolute; z-index: 20; right: 0; top: calc(100% + 4px); width: 320px; padding: 12px; background: var(--bg); border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; }
.ck { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.ck input { width: 14px; height: 14px; margin: 0; accent-color: var(--ink); flex: none; }
.ck:has(input:disabled) { color: var(--ink3); }

.scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(22, 26, 24, .36); }
.dlg { width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px 20px; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); }
.dlg h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.dlg .lead { color: var(--ink2); margin-bottom: 16px; overflow-wrap: anywhere; }
.dlg .q, .set .q { color: var(--ink3); font-size: 12px; }
.fld { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 10px 12px; margin-top: 14px; }
.fld > label, .fld > .lb { color: var(--ink2); }
.fld .note { grid-column: 2; margin-top: -4px; color: var(--ink3); font-size: 12px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--band); border-radius: 7px; justify-self: start; }

const ME = 'hinata';
const S = { screen: 'wt', sel: 0, sess: {}, drawer: null, issue: 220, pr: 228, prTab: 'conv', isState: 'open', isQ: '', draft: null, set: 'gen', rrepo: 'acme/webapp', edit: { set: 5, rset: -1 }, editKind: null, dlg: null };
const $ = id => document.getElementById(id);
const GROUPS = [['need', '対応が必要'], ['run', 'AI 実行中'], ['wait', '結果待ち'], ['done', '完了']];
const mark = k => '<span class="mark ' + k + '">' + (k === 'done' || k === 'ok' ? ic('check', 10) : k === 'fail' ? ic('x', 10) : '') + '</span>';
const br = b => { const i = b.indexOf('/'); return i < 0 ? esc(b) : '<i>' + esc(b.slice(0, i + 1)) + '</i>' + esc(b.slice(i + 1)); };
const stat = d => { let a = 0, m = 0; d.forEach(f => { a += f.add; m += f.del; }); return [a, m]; };

/* 状態（何が残っているか）と未読は別に持つ。
   状態はセッションと PR から導く。未読は worktree（一覧の行）、セッション（タブ）、PR / Issue（ヘッダーのリンク）ごとのフラグ。 */
const ATT = { err: ['異常終了', 1], fail: ['失敗', 1], wait: ['指示待ち', 0] };
// 残っている理由を優先度順に返す。壊れている(0) > AI が指示待ち(1) > PR のイベント(2)
const reasons = w => {
  const r = [];
  w.sess.forEach(s => {
    if (s.st === 'err') r.push({ t: TOOL[s.tool] + ' が異常終了', bad: 1, p: 0 });
    else if (s.st === 'fail') r.push({ t: s.name + '失敗', bad: 1, p: 0 });
    else if (s.st === 'wait') r.push({ t: TOOL[s.tool] + ' が指示待ち', bad: 0, p: 1 });
  });
  ((w.pr && PRS[w.pr].ev) || []).forEach(e => r.push({ t: e[0], bad: e[1], p: e[1] ? 0 : 2 }));
  return r.sort((a, b) => a.p - b.p);
};
const running = w => w.sess.filter(s => s.tool && s.st === 'run');
const group = w => reasons(w).length ? 'need' : running(w).length ? 'run' : w.grp;
WTS.forEach(w => { const r = reasons(w)[0]; w.ord = r ? (w.unread ? 0 : 10) + r.p : 0; });
const tone = (unread, bad) => (unread ? 'need' : 'seen') + (bad ? ' bad' : '');

function renderList() {
  let h = '';
  const row = (w, i) => {
    const g = group(w), rs = reasons(w), run = running(w), pr = w.pr && PRS[w.pr];
    const quiet = g === 'wait' || g === 'done' || g === 'main';
    let why = w.why || '';
    if (g === 'need') {
      why = rs[0].t +
        (rs.length > 1 ? '<span class="more" title="' + rs.slice(1).map(r => r.t).join('、') + '">+' + (rs.length - 1) + '</span>' : '') +
        (run.length ? '<span class="mark run" title="ほかに実行中のセッションが ' + run.length + ' 件"></span>' : '');
    } else if (g === 'run') why = [...new Set(run.map(s => TOOL[s.tool]))].join('、') + ' 実行中';
    return '<button class="row ' + g + (g === 'need' ? (w.unread ? ' unread' : '') + (rs[0].bad ? ' bad' : '') : '') + (quiet ? ' quiet' : '') +
      '" role="option" aria-selected="' + (i === S.sel) + '" data-wt="' + i + '">' +
      (g === 'main' ? '<span></span>' : mark(g === 'need' ? tone(w.unread, rs[0].bad) : g)) +
      '<span class="br">' + br(w.branch) + '</span>' +
      '<span class="why">' + why + '</span><span class="ref">' + (pr ? '#' + w.pr + (pr.by !== ME ? ' ' + pr.by : '') : '') + '</span>' +
      (g === 'main' ? '' : '<span class="del" role="button" tabindex="0" data-del="' + i + '" title="worktree を削除" aria-label="worktree を削除">' + ic('trash') + '</span>') +
      '</button>';
  };
  h += row(WTS[0], 0);
  let unread = 0, need = 0;
  GROUPS.forEach(([g, name]) => {
    const items = WTS.map((w, i) => [w, i]).filter(x => group(x[0]) === g);
    if (!items.length) return;
    let un = '';
    if (g === 'need') {
      // 未読を先に、その中では優先度順。並び順はイベントが届いたときに決まり、既読にしただけでは行は動かない
      items.sort((a, b) => a[0].ord - b[0].ord);
      need = items.length; unread = items.filter(x => x[0].unread).length;
      if (unread) un = '<span class="un">未読 ' + unread + '</span>';
    }
    h += '<div class="grp ' + g + '"><span>' + name + '</span><span>' + items.length + '</span>' + un + '</div>';
    items.forEach(x => { h += row(x[0], x[1]); });
  });
  $('list').innerHTML = h;
  const end = (n, u) => u ? '<span class="end need">未読 ' + u + '</span>' : n ? '<span class="end">対応が必要 ' + n + '</span>' : '';
  $('repomenu').innerHTML = '<button><span>acme/webapp</span>' + end(need, unread) + '</button>' +
    '<button><span>acme/api-server</span>' + end(2, 0) + '</button><button><span>hinata/dotfiles</span></button><hr><button data-rset="acme/webapp">このリポジトリの設定…</button><button data-set="repo">リポジトリを追加…</button>';
  $('repopip').hidden = !unread;
}

    '<button data-mk="1"' + (g === 'need' && !w.unread ? '' : ' disabled') + '>' + ic('dot') + '未読に戻す</button>' +
    '<button>' + ic('copy') + 'パスをコピー</button><hr>' +
    (g === 'main' ? '<button disabled>' + ic('trash') + 'main は削除できません</button>'
      : '<button class="danger" data-del="sel">' + ic('trash') + 'worktree を削除</button>');

  const cur = S.sess[S.sel];
  $('tabs').innerHTML = w.sess.map((s, i) => {
    const at = ATT[s.st];
    const st = at ? mark(tone(s.unread, at[1])) : s.st === 'run' ? mark('run') : '';
    const tail = at ? '<span class="st ' + (s.unread ? (at[1] ? 'bad' : 'need') : 'on') + '">' + at[0] + '</span>'
      : s.st === 'done' ? '<span class="st">終了</span>' : s.st === 'ok' ? '<span class="st">完了</span>' : '';
    return '<button class="tab" role="tab" aria-selected="' + (i === cur) + '" data-sess="' + i + '">' + st +
      (s.tool ? '<b>' + TOOL[s.tool] + '</b><span class="t">' + esc(s.title) + '</span>' : '<b' + (s.btn ? '' : ' class="mono"') + '>' + esc(s.name) + '</b>') + tail + '</button>';

  if (s.tool) {

  }
  const el = $('term'); el.innerHTML = t; el.scrollTop = el.scrollHeight;
}

/* ---------- Issue / PR / 差分：worktree 画面のパネルと全画面で同じ部品を使う ---------- */
const wtOfPr = n => WTS.findIndex(w => w.pr === +n);
const prIssue = n => PRS[n].issue || (WTS[wtOfPr(n)] || {}).issue;
const prBranch = n => PRS[n].branch || WTS[wtOfPr(n)].branch;
const prDiff = n => PRS[n].diff || WTS[wtOfPr(n)].diff;
const prUnread = n => { const i = wtOfPr(n); return i >= 0 ? WTS[i].prNew : PRS[n].unread; };
const prNote = pr => { const ev = pr.ev || []; return ev.length ? ev[0][0] : pr.note || ''; };
const cm = (who, sub, body, loc) => '<div class="cm">' + (loc ? '<div class="loc">' + loc + '</div>' : '') + '<div class="who"><b>' + who + '</b>　' + sub + '</div><p>' + body + '</p></div>';
const none = '<div class="q">なし</div>';
const wtLinks = list => '<div class="links">' + list.map(x => '<button data-wt="' + x[1] + '">' + esc(x[0].branch) + '</button>').join('') + '</div>';
const reply = (ph, label) => '<div class="reply"><textarea class="in" placeholder="' + ph + '"></textarea><div class="bar"><button class="btn">' + label + '</button></div></div>';

function issueDoc(n, here) {
  const is = ISSUES[n];
  const wts = WTS.map((w, i) => [w, i]).filter(x => x[0].issue === n && x[1] !== here);
  const prs = Object.keys(PRS).filter(k => prIssue(k) === n);
  return '<h2>' + esc(is.title) + '</h2><div class="sub"><span class="state">' + (is.closed ? 'Closed' : 'Open') + '</span><span>' + is.by + ' が' + is.when + 'に作成</span></div>' +
    '<div class="doc-grid"><div>' + is.body +
    '<h3>コメント ' + is.cm.length + '</h3>' + is.cm.map(c => cm(c[0], c[1], c[2])).join('') + reply('コメントを書く', 'コメント') + '</div>' +
    '<div class="doc-side"><h3>ラベル</h3><div class="sub">' + is.labels.map(l => '<span class="lab" style="--h:' + HUE[l] + '">' + l + '</span>').join('') + '</div>' +
    '<h3>Assignees</h3>' + (is.as ? '<div>' + is.as + '</div>' : none) +
    '<h3>PR</h3>' + (prs.length ? '<div class="links ui">' + prs.map(k => '<button data-pr="' + k + '"><span class="num">#' + k + '</span> ' + esc(PRS[k].title) + '</button>').join('') + '</div>' : none) +
    '<h3>' + (here >= 0 ? '同じ Issue の worktree' : 'worktree') + '</h3>' + (wts.length ? wtLinks(wts) : none) +
    '</div></div>';
}

// files: [{path, add, del, lines}]。o.pr を渡すと、行ごとのレビューコメントとコメントの追加が付く
function filesDoc(files, o) {
  const pr = o.pr && PRS[o.pr];
  return (files.length > 1 ? '<div class="flist">' + files.map(f => '<div><span>' + f.path + '</span><span class="ad">+' + f.add + '</span><span class="dl">−' + f.del + '</span></div>').join('') + '</div>' : '') +
    files.map((f, fi) => '<div class="file"><div class="file-h"><span>' + f.path + '</span><span class="ad">+' + f.add + '</span><span class="dl">−' + f.del + '</span></div><div class="hunk' + (pr ? ' rv' : '') + '">' +
      f.lines.map((l, li) => {
        const key = fi + ':' + li, hd = l[0] === '@';
        let h = '<div class="l ' + (l[0] === '+' ? 'pl' : l[0] === '-' ? 'mi' : hd ? 'h' : '') + '">' +
          (pr && !hd ? '<button class="addc" data-addc="' + key + '" title="この行にコメント" aria-label="この行にコメント">' + ic('plus', 11) + '</button>' : '') + (esc(l) || ' ') + '</div>';
        if (pr) {
          const th = pr.threads.filter(t => t[1].split(':')[0] === f.path && t[3] === li);
          const draft = S.draft === key;
          if (th.length || draft) h += '<div class="lthread">' + th.map(t => cm(t[0], '', t[2])).join('') +
            (draft ? '<div class="draft"><textarea class="in" id="draft" placeholder="この行へのコメント"></textarea><div class="bar"><button class="btn" data-a="draft-cancel">キャンセル</button><button class="btn primary" data-a="draft-add">コメントを追加</button></div></div>' : '') + '</div>';
        }
        return h;
      }).join('') + '</div></div>').join('');
}

function prDoc(n, here) {
  const pr = PRS[n], wi = wtOfPr(n), mine = pr.by === ME, files = prDiff(n), is = prIssue(n);
  const [a, d] = stat(files);
  const tab = (k, name) => '<button class="tab" role="tab" data-prtab="' + k + '" aria-selected="' + (S.prTab === k) + '"><b>' + name + '</b></button>';

  let h = '<h2>' + esc(pr.title) + '</h2><div class="sub"><span class="state">' + pr.state + '</span><span>' + pr.by + '</span><span class="mono">' + esc(prBranch(n)) + '</span></div>' +
    '<div class="dtabs" role="tablist">' + tab('conv', 'Conversation') + tab('files', 'Files changed') + '<span class="sp"></span>' +
    (S.prTab === 'files' ? '<details class="more rvw"><summary class="btn">レビューを送信</summary><div class="popf">' +
      '<textarea class="in" placeholder="全体へのコメント"></textarea>' +
      '<label class="ck"><input type="radio" name="rv" checked>Comment</label>' +

      '<div class="bar"><button class="btn primary" data-a="noop">送信</button></div></div></details>' : '') + '</div>';
  if (S.prTab === 'files') {
    return h + (files.length ? '<div class="sub"><span>' + files.length + ' ファイル</span><span class="mono"><span class="ad">+' + a + '</span> <span class="dl">−' + d + '</span></span></div>' + filesDoc(files, { pr: n })
      : '<div class="empty"><p>差分はありません。</p></div>');
  }
  const bad = pr.checks.filter(c => c[1] === 'fail').length;
  const loose = pr.threads.filter(t => t[0] !== ME || t[3] == null);
  return h + '<div class="doc-grid"><div>' + (pr.body || (is ? '<p>Closes #' + is + '</p>' : '')) +
    (pr.news ? '<h3>前回のレビュー以降のコミット ' + pr.news.length + '</h3>' + pr.news.map(c => '<div class="cmt"><span class="mono">' + c[0] + '</span><span>' + c[1] + '</span></div>').join('') : '') +
    '<h3>Checks' + (bad ? '　' + bad + ' 件失敗' : '') + '</h3>' +
    pr.checks.map(c => '<div class="chk ' + c[1] + '">' + mark(c[1]) + '<span class="n">' + c[0] + '</span><span class="x">' + c[2] + '</span></div>').join('') +
    (loose.length ? '<h3>レビューコメント ' + loose.length + '</h3>' + loose.map(c => cm(c[0], '', c[2], c[1])).join('') : '') +
    (mine && pr.state !== 'Merged' ? '<div class="mergebar"><button class="btn' + (pr.can ? ' primary' : '') + '"' + (pr.can ? '' : ' disabled') + '>マージ</button><span>' + pr.merge + '</span></div>'
      : pr.merge ? '<div class="mergebar"><span>' + pr.merge + '</span></div>' : '') +
    reply('コメントを書く', 'コメント') + '</div>' +
    '<div class="doc-side"><h3>レビュー</h3>' + (pr.reviews.length ? pr.reviews.map(r => '<div class="chk">' + mark(rv(r[1])) + '<span>' + r[0] + '</span><span class="x">' + r[1] + '</span></div>').join('') : none) +
    '<h3>Issue</h3>' + (is ? '<div class="links ui"><button data-issue="' + is + '"><span class="num">#' + is + '</span> ' + esc(ISSUES[is].title) + '</button></div>' : none) +
    (here >= 0 ? '' : '<h3>worktree</h3>' + (wi >= 0 ? wtLinks([[WTS[wi], wi]]) : none)) +
    '</div></div>';
}

  if (d.t === 'rdel') {
    const mine = d.r === 'acme/webapp', wts = WTS.slice(1);
    const info = mine ? { wts: wts.length, dirty: wts.filter(w => w.dirty).map(w => w.branch), unp: wts.filter(w => w.unpushed).map(w => w.branch), run: WTS.reduce((n, w) => n + runSess(w).length, 0) }
      : REPOS.find(r => r.name === d.r).info;
    const what = lossWords(info.dirty.length, info.unp.length);
    return '<h2>リポジトリを削除</h2><div class="lead"><span class="mono">' + d.r + '</span><br><span class="mono q">' + BASE + '/' + d.r + '</span></div>' +
      '<p>クローンと worktree をディスクから削除します。GitHub のリポジトリは変わりません。</p><div class="loss">' +
      loss('worktree', info.wts ? info.wts + ' 件' : 'なし') +
      loss('未コミットの変更', info.dirty.length ? info.dirty.length + ' 件の worktree（失われます）' : 'なし', info.dirty.length, info.dirty) +
      loss('push していないコミット', info.unp.length ? info.unp.length + ' 件の worktree（失われます）' : 'なし', info.unp.length, info.unp) +
      loss('実行中のセッション', info.run ? info.run + ' 件（終了します）' : 'なし') + '</div>' +
      (what ? '<div class="confirm">' + ck(d, 'ok', what + 'を破棄して削除する') + '</div>' : '') +
      '<div class="dlg-foot"><button class="btn" data-a="dlg-close">キャンセル</button><button class="btn danger" data-a="dlg-close"' + (what && !d.ok ? ' disabled' : '') + '>削除</button></div>';
  }
  const w = WTS[d.i], pr = w.pr && PRS[w.pr], dirty = w.dirty || 0, unp = w.unpushed || 0, run = runSess(w);
  const what = lossWords(dirty, unp);
  return '<h2>worktree を削除</h2><div class="lead"><span class="mono">' + esc(w.branch) + '</span><br><span class="mono q">' + w.path + '</span></div>' +
    '<div class="loss">' +
    loss('未コミットの変更', dirty ? dirty + ' ファイル（失われます）' : 'なし', dirty) +
    loss('push していないコミット', unp ? unp + ' 件' : 'なし', unp) +
    loss('実行中のセッション', run.length ? run.map(s => s.tool ? TOOL[s.tool] : s.name).join('、') + '（終了します）' : 'なし') +
    loss('PR', pr ? '#' + w.pr + ' ' + (pr.state === 'Merged' ? 'マージ済み' : pr.state + '（マージされていません）') : 'なし') +
    '</div>' +
    ck(d, 'br', 'ローカルブランチも削除する') +
    ck(d, 'rb', pr && pr.by !== ME ? 'リモートブランチも削除する（' + pr.by + ' のブランチは削除できません）' : pr ? 'リモートブランチも削除する' : 'リモートブランチも削除する（push されていません）', !pr || pr.by !== ME) +
    (what ? '<div class="confirm">' + ck(d, 'ok', what + 'を破棄して削除する') + '</div>' : '') +
    '<div class="dlg-foot"><button class="btn" data-a="dlg-close">キャンセル</button><button class="btn danger" data-a="dlg-close"' + (what && !d.ok ? ' disabled' : '') + '>削除</button></div>';
}
function renderDlg() {
  $('scrim').hidden = !S.dlg;
  if (S.dlg) $('dlg').innerHTML = dlgDoc();
}
const openDel = i => { const w = WTS[i], pr = w.pr && PRS[w.pr]; S.dlg = { t: 'del', i, br: !!(pr && pr.state === 'Merged'), rb: false, ok: false }; };

// いま見えているものを既読にする：表示中のタブ、開いている PR / Issue
function seen() {
  const w = WTS[S.sel];
  if (S.sess[S.sel] == null) {
    // 最初に開くタブは、未読のセッション、なければ対応が残っているセッション
    const pick = f => w.sess.findIndex(f);
    const i = [s => s.unread && ATT[s.st] && ATT[s.st][1], s => s.unread, s => ATT[s.st] && ATT[s.st][1], s => ATT[s.st]].map(pick).find(x => x >= 0);
    S.sess[S.sel] = i || 0;
  }
  if (S.screen !== 'wt') return;
  w.sess[S.sess[S.sel]].unread = 0;
  if (S.drawer === 'pr') w.prNew = 0;
  if (S.drawer === 'issue' && w.issue) ISSUES[w.issue].fresh = 0;
}
const render = () => { seen(); renderMain(); renderDrawer(); renderList(); renderPage(); renderNav(); renderDlg(); };
// worktree を選ぶと、その行は既読になる
const select = i => { S.sel = i; WTS[i].unread = 0; };

document.addEventListener('click', e => {
  document.querySelectorAll('details[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.pop')) d.open = false; });
  if (e.target.id === 'scrim') { S.dlg = null; render(); return; }
  const t = e.target.closest('[data-del],[data-new],[data-wt],[data-sess],[data-open],[data-mk],[data-screen],[data-issue],[data-pr],[data-prtab],[data-isst],[data-set],[data-editbtn],[data-kind],[data-reset],[data-rset],[data-rdel],[data-addc],[data-nmode],[data-a],#dclose');
  if (!t || t.disabled) return;
  const D = t.dataset;
  if (D.del != null) { e.stopPropagation(); openDel(D.del === 'sel' ? S.sel : +D.del); }
  else if (D.new != null) openNew(D.new);
  else if (D.wt) { S.screen = 'wt'; select(+D.wt); }
  else if (D.sess) S.sess[S.sel] = +D.sess;
  else if (D.open) S.drawer = S.drawer === D.open ? null : D.open;
  else if (D.mk) WTS[S.sel].unread = 1;
  else if (D.screen) S.screen = D.screen;
  else if (D.issue) { S.screen = 'issue'; S.issue = +D.issue; if (!!ISSUES[S.issue].closed !== (S.isState === 'closed')) S.isState = ISSUES[S.issue].closed ? 'closed' : 'open'; }
  else if (D.pr) { S.screen = 'pr'; S.pr = +D.pr; S.prTab = 'conv'; S.draft = null; }
  else if (D.prtab) { S.prTab = D.prtab; S.draft = null; }
  else if (D.isst) S.isState = D.isst;
  else if (D.set) { S.screen = 'set'; S.set = D.set; }
  else if (D.rset) { S.screen = 'rset'; S.rrepo = D.rset; }
  else if (D.rdel) S.dlg = { t: 'rdel', r: D.rdel, ok: false };
  else if (D.editbtn) { S.edit[S.screen] = +D.editbtn; S.editKind = null; }
  else if (D.kind) S.editKind = D.kind;
  else if (D.reset) AICMD[+D.reset].cmd = AICMD[+D.reset].def;
  else if (D.addc) S.draft = D.addc;
  else if (D.a === 'dlg-close') S.dlg = null;
  else if (D.a === 'draft-cancel') S.draft = null;
  else if (D.a === 'draft-add') {
    // 追加したコメントは、その行のスレッドに入る（レビューを送信するまでは下書き）
    const text = $('draft').value.trim(), n = S.screen === 'pr' ? S.pr : WTS[S.sel].pr, [fi, li] = S.draft.split(':').map(Number);
    if (text) PRS[n].threads.push([ME, prDiff(n)[fi].path, esc(text), li]);
    S.draft = null;
  }
  else if (t.id === 'dclose') S.drawer = null;
  render();
  if (D.addc) $('draft').focus();
});
document.addEventListener('change', e => {
  const t = e.target, d = S.dlg;
  if (t.dataset.ck) { d[t.dataset.ck] = t.checked; renderDlg(); }
  else if (t.id === 'nissue') { d.issue = +t.value; newDefaults(d); renderDlg(); }
  else if (t.id === 'npr') { d.pr = +t.value; newDefaults(d); renderDlg(); }
  else if (t.dataset.aicmd) { AICMD[+t.dataset.aicmd].cmd = t.value.trim(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'isq') { S.isQ = t.value; issueRows(); }
  else if (t.id === 'nbranch') { S.dlg.branch = t.value.trim(); $('npath').textContent = pathNote(S.dlg.branch); $('ntaken').textContent = takenNote(S.dlg.branch); $('ncreate').disabled = !S.dlg.branch || !!taken(S.dlg.branch); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.dlg) S.dlg = null; else if (S.drawer) S.drawer = null; else return;
  render();
});
/* 開いた直後の状態を URL のハッシュで指定できる。
   #ブランチ名,パネル,セッション,PR のタブ ／ #issue,番号 ／ #pr,番号,files ／ #set,btn ／ #rset,acme/webapp,0 ／ #new,issue,番号 ／ #del,ブランチ名,ok ／ #rdel,acme/webapp ／ #empty */
const h0 = decodeURIComponent(location.hash.slice(1)).split(',');
const byBranch = b => Math.max(WTS.findIndex(w => w.branch === b), 0);
select(byBranch('fix/214-search-pagination-dup'));
if (h0[0] === 'issue') { S.screen = 'issue'; if (ISSUES[h0[1]]) S.issue = +h0[1]; }
else if (h0[0] === 'pr') { S.screen = 'pr'; if (PRS[h0[1]]) S.pr = +h0[1]; if (h0[2]) S.prTab = h0[2]; }
else if (h0[0] === 'set') { S.screen = 'set'; if (h0[1]) S.set = h0[1]; }
else if (h0[0] === 'rset') { S.screen = 'rset'; if (RBTNS[h0[1]]) S.rrepo = h0[1]; if (h0[2]) S.edit.rset = +h0[2]; }
else if (h0[0] === 'rdel') { S.screen = 'set'; S.set = 'repo'; S.dlg = { t: 'rdel', r: h0[1] || 'acme/webapp', ok: false }; }
else if (h0[0] === 'empty') S.screen = 'empty'; // リポジトリがまだ 1 つもないとき
else if (h0[0] === 'new') { openNew(h0[1] ? h0[1] + ':' + h0[2] : ''); if (h0[3]) S.dlg.branch = h0[3]; }
else if (h0[0] === 'del') { openDel(byBranch(h0[1])); S.dlg.ok = h0[2] === 'ok'; }
else if (h0[0]) {
  select(byBranch(h0[0]));
  if (h0[1]) S.drawer = h0[1];
  if (h0[2]) S.sess[S.sel] = +h0[2];
  if (h0[3]) S.prTab = h0[3];
}
render();
</script>
</body>
</html>
