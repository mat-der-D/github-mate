<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>github-mate — worktree</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#fdfdfc; --side:#f4f4f1; --line:#e4e4df; --line2:#eeeeea;
  --fill:#e7e7e1; --hover:#ecece7; --field:#f6f6f3;
  --text:#1c1d1a; --muted:#686a63; --faint:#9d9f97;
  --need:#d98200; --fail:#cc3a2b; --ok:#2c8a4b;
  --add-bg:#e8f5eb; --del-bg:#fbebe8;
  --shadow:0 1px 2px rgba(30,32,25,.06),0 12px 32px rgba(30,32,25,.12);
  --ui:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK JP",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191a18; --side:#131412; --line:#2a2b28; --line2:#222320;
    --fill:#2a2b28; --hover:#1f201d; --field:#1f201d;
    --text:#e5e6e1; --muted:#9a9c94; --faint:#676962;
    --need:#f2b03a; --fail:#f07362; --ok:#6fc48a;
    --add-bg:#1a2d20; --del-bg:#351f1c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
h1,h2,h3,p,ul{margin:0;padding:0}
svg{flex:none;display:block}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}

#app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100vh;min-width:960px}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--line)}
.repo{position:relative;padding:10px 10px 0}
.repo-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;font-weight:600;font-size:13.5px}
.repo-btn:hover{background:var(--hover)}
.repo-btn .org{color:var(--muted);font-weight:400}
.repo-btn svg{color:var(--faint)}
.menu{position:absolute;top:42px;left:10px;width:246px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:20}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:5px}
.menu button:hover{background:var(--hover)}
.menu .nm{flex:1}
.menu .ct{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.menu .add{color:var(--muted);margin-top:4px;border-top:1px solid var(--line2);border-radius:0 0 5px 5px}
.nav{display:flex;gap:2px;padding:10px 10px 8px}
.nav button{height:26px;padding:0 8px;border-radius:6px;color:var(--muted)}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button[aria-current=page]{color:var(--text);font-weight:600}
.rows{flex:1;min-height:0;overflow:auto;padding:0 8px 8px;scrollbar-width:thin}
.grp+.grp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:start;width:100%;padding:6px 8px 7px 6px;border-radius:6px;color:var(--muted)}
.row:hover{background:var(--hover)}
.row[aria-selected=true]{background:var(--fill)}
.row .mk{margin-top:5px;justify-self:center}
.bn{display:block;font:12.5px/1.5 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .px{opacity:.62}
.rs{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.5;white-space:nowrap}
.rs .x{color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.rs time{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums}
.row.need{color:var(--text)}
.row.need .bn{font-weight:600}
.row.need .rs b{font-weight:500}
.row.fail .rs b{color:var(--fail)}
.row.done,.row.done .rs{color:var(--faint)}
.rs b{font-weight:400}
.newwt{display:flex;align-items:center;gap:8px;width:100%;height:30px;margin-top:6px;padding:0 8px 0 9px;border-radius:6px;color:var(--faint)}
.newwt:hover{background:var(--hover);color:var(--text)}
.side-f{padding:8px 10px;border-top:1px solid var(--line)}
.side-f button{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;color:var(--muted)}
.side-f button:hover{background:var(--hover);color:var(--text)}

/* marks: the only state vocabulary on the screen */
.mk{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.mk.need{background:var(--need)}
.mk.fail{background:var(--fail)}
.mk.run{width:9px;height:9px;border:1.5px solid currentColor;border-right-color:transparent;opacity:.75;animation:rot 1.1s linear infinite}
.mk.hold{border:1.5px solid var(--faint)}
.mk.done{width:10px;height:6px;border-radius:0;border:solid var(--faint);border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(1px,-2px)}
.mk.none{visibility:hidden}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:12px;height:50px;min-width:0;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.head h1{font:600 14.5px/1 var(--mono);white-space:nowrap;letter-spacing:-.01em}
.head h1 .px{color:var(--muted);font-weight:400}
.head .sub{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refs{display:flex;gap:2px;flex:none}
.ref{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;white-space:nowrap;color:var(--muted)}
.ref:hover{background:var(--hover);color:var(--text)}
.ref b{font-weight:500;color:var(--text)}
.ref.none b{color:var(--faint);font-weight:400}
.ref[aria-pressed=true]{background:var(--fill);color:var(--text)}
.ref .p{color:var(--ok)}.ref .m{color:var(--fail)}
.ref .mk{margin-right:-1px}
.sepv{width:1px;height:16px;background:var(--line);margin:0 4px;flex:none}
.del{display:flex;align-items:center;gap:6px;height:28px;padding:0 7px;border-radius:6px;color:var(--faint);white-space:nowrap}
.del:hover{background:var(--hover);color:var(--fail)}
.del.go{color:var(--text);padding:0 10px;box-shadow:inset 0 0 0 1px var(--line)}

.work{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.work.open{grid-template-columns:minmax(0,1fr) 440px}
.tcol{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.tabs{display:flex;align-items:stretch;gap:2px;height:38px;padding:0 14px}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);font-weight:500}
.tab[aria-selected=true]::after{content:"";position:absolute;left:9px;right:9px;bottom:6px;height:1.5px;background:var(--text);border-radius:1px}
.tab.end{color:var(--faint)}
.tab .mk{margin-left:1px}
.tab.plus{padding:0 8px;color:var(--faint)}

.term{min-height:0;overflow:auto;padding:6px 23px 16px;font:12.5px/1.65 var(--mono);scrollbar-width:thin}
.term div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.65em}
.term .u{color:var(--text);background:var(--field);margin:0 -9px;padding:2px 9px;border-radius:4px}
.term .say,.term .tool{padding-left:2ch;text-indent:-2ch}
.term .tool{font-weight:600}
.term .dim{color:var(--muted)}
.term .add{color:var(--ok)}
.term .rm,.term .err{color:var(--fail)}
.term .pass{color:var(--ok)}
.term .work{color:var(--muted)}
.term .inbox{margin:10px -9px 0;padding:6px 9px;border:1px solid var(--line);border-radius:6px}
.term .inbox.bare{border-color:transparent;padding-left:9px}
.term .hint{color:var(--faint)}
.cur{display:inline-block;width:.58em;height:1.15em;vertical-align:-2.5px;background:var(--text);animation:blink 1.1s steps(1) infinite}

.acts{display:flex;gap:2px;overflow:hidden;min-width:0;padding:5px 14px;border-top:1px solid var(--line)}
.act{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.act svg{opacity:.8}
.act:hover{background:var(--hover);color:var(--text)}
.act[disabled]{opacity:.38;cursor:default;background:none;color:var(--muted)}

/* ---------- drawer: Issue / PR / 差分 ---------- */
.drawer{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line)}
.d-body{flex:1;min-height:0;overflow:auto;padding:18px 20px 28px;scrollbar-width:thin}
.d-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--muted);font-size:12px}
.d-top .sp{flex:1}
.d-top button{display:grid;place-items:center;width:24px;height:24px;margin:-4px -6px -4px 0;border-radius:5px;color:var(--faint)}
.d-top button:hover{background:var(--hover);color:var(--text)}
.d-body h2{font-size:15px;line-height:1.5;font-weight:600;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;color:var(--muted);font-size:12px}
.meta .st{color:var(--text);font-weight:500}
.lab{padding:0 7px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);line-height:18px;font-size:11.5px}
.prose{margin-top:14px;line-height:1.75}
.prose p+p,.prose p+ul,.prose ul+p{margin-top:8px}
.prose ul{padding-left:18px}
code{font:12px var(--mono);background:var(--field);padding:1px 4px;border-radius:3px}
.sec{margin-top:20px;padding-top:14px;border-top:1px solid var(--line2)}
.sec h3{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.li{display:flex;align-items:baseline;gap:9px;padding:3px 0}
.li .mk{align-self:flex-start;margin-top:7px}
.li .t{flex:1;min-width:0}
.li .v{color:var(--muted);font-size:12px;white-space:nowrap}
.li .why{display:block;color:var(--muted);font-size:12px;line-height:1.6}
.cm{padding:8px 0}
.cm .who{font-size:12px;color:var(--muted)}
.cm .who b{color:var(--text);font-weight:500}
.cm .at{font:11.5px var(--mono);color:var(--muted);display:block;margin-top:2px}
.cm p{margin-top:2px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--text);color:var(--bg);box-shadow:none}
.btn.pri:hover{opacity:.88}
.btn[disabled]{opacity:.4;cursor:default}
.mg{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);color:var(--muted);font-size:12px}
.empty{padding:56px 0 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-weight:500;margin-bottom:4px}
.empty .btn{margin-top:14px}
.fl{margin-top:12px}
.fl .f{display:flex;gap:10px;padding:3px 0;font:12px/1.6 var(--mono)}
.fl .f span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.p{color:var(--ok)}.m{color:var(--fail)}
.hunk{margin:14px -20px 0;font:12px/1.7 var(--mono);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.hunk .hf{padding:6px 20px;color:var(--muted);border-bottom:1px solid var(--line2)}
.hunk div{white-space:pre;overflow:hidden;text-overflow:ellipsis;padding:0 20px}
.hunk .a{background:var(--add-bg)}.hunk .d{background:var(--del-bg)}.hunk .h{color:var(--faint)}

@media (max-width:1250px){
  #app{grid-template-columns:264px minmax(0,1fr)}
  .bn{font-size:12px}
  .work.open{grid-template-columns:minmax(0,1fr) 380px}
  .head{padding-left:16px}
  .tabs,.acts{padding-left:10px;padding-right:10px}
  .term{padding-left:19px;padding-right:19px}
  .act{padding:0 6px;gap:5px;font-size:12px}
  .main.dopen .head .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">

    <div class="repo">
      <button class="repo-btn" data-a="repo" aria-haspopup="true" aria-expanded="false"><span><span class="org">acme/</span>webapp</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5l3-3"/></svg></button>
      <div class="menu" id="menu" hidden>

</div>

<script>
'use strict';
const svg = d => '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const IC = {

  build: svg('<path d="M2 5.2 8 2l6 3.2v5.6L8 14l-6-3.200zM2 5.2l6 3.200 6-3.200M8 8.400V14"/>'),
  test: svg('<path d="M6 1.800h4M6.600 1.800v4.400L2.700 13a1 1 0 0 0 .9 1.500h8.800a1 1 0 0 0 .9-1.500L9.400 6.200V1.800M4.700 10.500h6.600"/>'),

};
const ACTIONS = [
  ['folder', 'フォルダを開く'], ['code', 'VS Code'], ['claude', 'Claude Code'], ['codex', 'Codex'], ['agy', 'Antigravity'],
  ['issue', 'Issue を実装', 'issue'], ['review', 'PR をレビュー', 'pr'], ['build', 'ビルド'], ['test', 'テスト']
];
const AI_IC = { 'Claude Code': 'claude', 'Codex': 'codex', 'Antigravity': 'agy' };
const T = s => s.replace(/^\n/, '').replace(/\n\s*$/, '');

const ISSUES = {
  214: { title: '検索結果のページネーションが2ページ目で重複する', labels: ['bug', 'backend'], by: 'sato-k', at: '2日前',
    body: '<p>検索結果の2ページ目に、1ページ目の末尾にあった項目がもう一度出ることがあります。</p><p>再現手順</p><ul><li>「請求」で検索する（スコアが同じ項目が多い）</li><li>2ページ目に進む</li><li>1ページ目の 19〜20 件目と同じ項目が先頭に出る</li></ul><p>期待する動作：どの項目も1回だけ出る。</p>',
    cm: [['mtanaka', '2日前', '本番でも再現しました。スコアが同点の項目が多い検索語でだけ起きるようです。'], ['hinata', '1日前', '<code>ORDER BY</code> が安定していないのが原因に見えます。調べます。']] },

  187: { title: '通知メールのテンプレートを React Email に移行する', labels: ['refactor'], by: 'hinata', at: '9日前',

};
const PRS = {

const S = { sel: WTS[0].b, sess: {}, drawer: null };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const cur = () => WTS.find(w => w.b === S.sel);
const bname = b => { const i = b.indexOf('/'); return i < 0 ? esc(b) : '<span class="px">' + esc(b.slice(0, i + 1)) + '</span>' + esc(b.slice(i + 1)); };
const firstSess = w => Math.max(0, w.ss.findIndex(s => s.st === 'wait'));
const sessIdx = w => (w.b in S.sess) ? S.sess[w.b] : firstSess(w);
const mk = m => '<i class="mk ' + m + '"></i>';

/* ---------- list ---------- */
function renderRows() {
  const groups = ['need', 'run', 'hold', 'done', 'main'].map(k => WTS.filter(w => w.kind === k)).filter(g => g.length);
  // 待ち・完了・main は1つのまとまりにして、区切りを減らす
  const merged = [groups[0], groups[1], [].concat(...groups.slice(2))];
  document.getElementById('rows').innerHTML = merged.map((g, gi) => '<div class="grp">' + g.map(w =>
    '<button class="row ' + w.kind + (w.mark === 'fail' ? ' fail' : '') + '" role="option" aria-selected="' + (w.b === S.sel) + '" data-a="sel" data-v="' + esc(w.b) + '"' + (w.issue ? ' title="#' + w.issue + ' ' + esc(ISSUES[w.issue].title) + '"' : '') + '>' +
      mk(w.mark) + '<span><span class="bn">' + bname(w.b) + '</span>' +
      (w.why ? '<span class="rs"><b>' + w.why + '</b>' + (w.extra ? '<span class="x">' + w.extra + '</span>' : '') + (w.ago ? '<time>' + w.ago + '</time>' : '') + '</span>' : '') +
    '</span></button>').join('') +
    (gi === merged.length - 1 ? '<button class="newwt">' + IC.plus + '新しい worktree</button>' : '') + '</div>').join('');
}

function termHtml(s) {
  const ai = !!s.ai;
  const src = !ai ? s.t.split('\n') : s.t.split('\n').reduce((a, l) => { if (/^  [^\s⎿└]/.test(l) && a.length && /^[●•] /.test(a[a.length - 1])) a[a.length - 1] += l.slice(2); else a.push(l); return a; }, []);
  const body = src.map(l => {
    let c = '';
    if (!ai) c = /^\$ /.test(l) ? '' : 'dim';
    else if (/^[>›] /.test(l)) c = 'u';
    else if (/^[✻]|^• Working/.test(l)) c = 'work';
    else if (/^\s+\d+ \+/.test(l)) c = 'add';
    else if (/^\s+\d+ -/.test(l)) c = 'rm';
    else if (/✗|error TS/.test(l)) c = 'err';
    else if (/^[●•] (\w+\(|Ran |Explored|Edit |Create |Run )/.test(l)) c = 'tool';
    else if (/^\s+[⎿└]|^\s{4,}/.test(l)) c = 'dim';
    else if (/^[●•] /.test(l)) c = 'say';
    return '<div' + (c ? ' class="' + c + '"' : '') + '>' + esc(l) + '</div>';
  }).join('');
  let tail;
  if (!ai || s.st === 'end') tail = /pnpm dev/.test(s.t) ? '' : '<div>&nbsp;</div><div>$ <i class="cur"></i></div>';
  else if (s.ai === 'Codex') tail = '<div class="inbox bare">› ' + (s.st === 'wait' ? '<i class="cur"></i>' : '') + '</div>';
  else tail = '<div class="inbox">&gt; ' + (s.st === 'wait' ? '<i class="cur"></i>' : '') + '</div>';
  return body + tail;
}

/* ---------- drawer ---------- */
const dTop = (label) => '<div class="d-top"><span>' + label + '</span><span class="sp"></span><button data-a="close" title="閉じる" aria-label="閉じる">' + IC.x + '</button></div>';
function issueHtml(w) {
  if (!w.issue) return dTop('Issue') + '<div class="empty"><b>Issue はありません</b>この worktree はどの Issue にも紐づいていません。<br><button class="btn">Issue を紐づける</button></div>';
  const i = ISSUES[w.issue];
  const shared = WTS.filter(x => x.issue === w.issue && x !== w);
  return dTop('Issue #' + w.issue) + '<h2>' + esc(i.title) + '</h2>' +
    '<div class="meta"><span class="st">' + (w.kind === 'done' ? 'Closed' : 'Open') + '</span><span>' + i.by + ' が' + i.at + 'に作成</span>' + i.labels.map(l => '<span class="lab">' + l + '</span>').join('') + '</div>' +
    '<div class="prose">' + i.body + '</div>' +
    (shared.length ? '<div class="sec"><h3>同じ Issue の worktree</h3>' + shared.map(x => '<div class="li"><button class="t mono" style="font-size:12.5px" data-a="sel" data-v="' + esc(x.b) + '">' + bname(x.b) + '</button><span class="v">' + x.why + '</span></div>').join('') + '</div>' : '') +
    (i.cm.length ? '<div class="sec"><h3>コメント ' + i.cm.length + '件</h3>' + i.cm.map(c => '<div class="cm"><div class="who"><b>' + c[0] + '</b>　' + c[1] + '</div><p>' + c[2] + '</p></div>').join('') + '</div>' : '');
}
const CK = { ok: 'done', fail: 'fail', run: 'run' };
function prHtml(w) {
  if (!w.pr) return dTop('PR') + '<div class="empty"><b>PR はまだありません</b>' + (w.main ? 'main は PR の対象になりません。' : 'このブランチはまだ push されていません。<br><button class="btn">PR を作成</button>') + '</div>';
  const p = PRS[w.pr];
  return dTop('PR #' + w.pr) + '<h2>' + esc(p.title) + '</h2>' +
    '<div class="meta"><span class="st">' + p.state + '</span><span>' + p.by + '</span><span class="mono">' + esc(w.b) + ' → main</span></div>' +
    '<div class="sec"><h3>CI</h3>' + p.checks.map(c => '<div class="li">' + mk(CK[c[1]]) + '<span class="t">' + c[0] + (c[3] ? '<span class="why">' + esc(c[3]) + '</span>' : '') + '</span><span class="v">' + (c[1] === 'fail' ? '失敗　' : c[1] === 'run' ? '実行中' : '') + c[2] + '</span></div>').join('') + '</div>' +
    '<div class="sec"><h3>レビュー</h3>' + (p.reviews.length ? p.reviews.map(r => '<div class="li"><span class="t">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('') : '<div class="li"><span class="v">レビュアーは未設定です</span></div>') + '</div>' +
    (p.rc ? '<div class="sec"><h3>未解決のレビューコメント ' + p.rc.length + '件</h3>' + p.rc.map(c => '<div class="cm"><div class="who"><b>' + c[0] + '</b><span class="at">' + c[1] + '</span></div><p>' + c[2] + '</p></div>').join('') + '</div>' : '') +
    '<div class="mg">' + (p.state === 'Merged' ? '' : p.rev ? '<button class="btn pri">レビューを書く</button>' : '<button class="btn pri"' + (p.can ? '' : ' disabled') + '>マージ</button>') + '<span>' + p.note + '</span></div>';
}
function diffHtml(w) {
  if (!w.files.length) return dTop('差分') + '<div class="empty"><b>差分はありません</b>' + (w.main ? '作業ツリーに変更はありません。' : 'main と同じ内容です。') + '</div>';
  return dTop('差分（main との比較）') + '<h2>Files changed ' + w.files.length + '　<span class="p">+' + w.add + '</span> <span class="m">−' + w.rm + '</span></h2>' +
    '<div class="fl">' + w.files.map(f => '<div class="f"><span>' + esc(f[0]) + '</span><span class="p">+' + f[1] + '</span><span class="m">−' + f[2] + '</span></div>').join('') + '</div>' +
    '<div class="hunk"><div class="hf">' + esc(w.hunk[0]) + '</div>' + w.hunk.slice(1).map(l => '<div class="' + (l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : l[0] === '@' ? 'h' : '') + '">' + esc(l) + '</div>').join('') + '</div>';
}

/* ---------- main ---------- */
function prNote(w) {
  if (!w.pr) return '';
  const p = PRS[w.pr];
  if (w.why === 'CI 失敗') return mk('fail') + 'CI 失敗';
  if (w.why === 'マージ可能') return mk('need') + 'マージ可能';
  if (p.rc) return mk('need') + 'コメント ' + p.rc.length + '件';
  if (p.state !== 'Open') return p.state;
  return w.other ? w.other : w.why === 'レビュー待ち' ? 'レビュー待ち' : '';
}
function renderMain() {
  const w = cur(), si = sessIdx(w), s = w.ss[si];
  const sub = w.issue ? '#' + w.issue + ' ' + ISSUES[w.issue].title : w.pr ? PRS[w.pr].title : '';
  const ref = (k, html, none) => '<button class="ref' + (none ? ' none' : '') + '" data-a="drawer" data-v="' + k + '" aria-pressed="' + (S.drawer === k) + '">' + html + '</button>';
  const head = '<header class="head"><h1>' + bname(w.b) + '</h1><span class="sub">' + esc(sub) + '</span><div class="refs">' +
    ref('issue', w.issue ? '<b>Issue</b>#' + w.issue : '<b>Issue なし</b>', !w.issue) +
    ref('pr', w.pr ? '<b>PR</b>#' + w.pr + ' ' + prNote(w) : '<b>PR なし</b>', !w.pr) +
    ref('diff', w.files.length ? '<b>差分</b><span><span class="p">+' + w.add + '</span> <span class="m">−' + w.rm + '</span></span>' : '<b>差分なし</b>', !w.files.length) +
    '</div>' + (w.main ? '' : '<span class="sepv"></span>' + (w.kind === 'done' ? '<button class="del go">' + IC.trash + 'worktree を削除</button>' : '<button class="del" title="worktree を削除" aria-label="worktree を削除">' + IC.trash + '</button>')) + '</header>';
  const tabs = '<div class="tabs" role="tablist">' + w.ss.map((x, i) =>
    '<button class="tab' + (x.st === 'end' ? ' end' : '') + '" role="tab" aria-selected="' + (i === si) + '" data-a="sess" data-v="' + i + '" title="' + (x.ai ? x.ai + '：' + ({ wait: '指示待ち', run: '実行中', end: '終了' })[x.st] : esc(x.n)) + '">' +
    (x.ai ? IC[AI_IC[x.ai]] : IC.term) + esc(x.n) + (x.st === 'wait' ? mk('need') : x.st === 'run' ? mk('run') : '') + '</button>').join('') +
    '<button class="tab plus" title="新しいターミナル" aria-label="新しいターミナル">' + IC.plus + '</button></div>';
  const acts = '<div class="acts">' + ACTIONS.map(a => '<button class="act"' + (a[2] && !w[a[2]] ? ' disabled title="この worktree には ' + (a[2] === 'pr' ? 'PR' : 'Issue') + ' がありません"' : '') + '>' + IC[a[0]] + a[1] + '</button>').join('') + '</div>';
  const drawer = S.drawer ? '<aside class="drawer"><div class="d-body">' + ({ issue: issueHtml, pr: prHtml, diff: diffHtml })[S.drawer](w) + '</div></aside>' : '';
  const m = document.getElementById('main');
  m.className = 'main' + (S.drawer ? ' dopen' : '');
  m.innerHTML = head + '<div class="work' + (S.drawer ? ' open' : '') + '"><section class="tcol">' + tabs + '<div class="term" id="term">' + termHtml(s) + '</div></section>' + drawer + '</div>' + acts;
  const t = document.getElementById('term'); t.scrollTop = t.scrollHeight;
}
function render() { renderRows(); renderMain(); }

document.addEventListener('click', e => {
  const menu = document.getElementById('menu'), rb = document.querySelector('.repo-btn');
  const t = e.target.closest('[data-a]');
  if (!t || t.dataset.a !== 'repo') { menu.hidden = true; rb.setAttribute('aria-expanded', 'false'); }
  if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === 'repo') { menu.hidden = !menu.hidden; rb.setAttribute('aria-expanded', String(!menu.hidden)); return; }
  if (a === 'sel') S.sel = v;
  else if (a === 'sess') S.sess[S.sel] = +v;
  else if (a === 'drawer') S.drawer = S.drawer === v ? null : v;
  else if (a === 'close') S.drawer = null;
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); } });
const h = location.hash.slice(1).split(',');
if (h[0] && WTS[+h[0]]) S.sel = WTS[+h[0]].b;
if (h[1]) S.drawer = h[1];
render();
</script>
</body>
</html>
